<!doctype html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StudyOS</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1b2333">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
<style>
/* ============================================================
   StudyOS — tek dosya çalışma masaüstü
   1. Tema değişkenleri  2. Masaüstü  3. Menü çubuğu  4. Dock
   5. Pencereler  6. Ortak bileşenler  7. Uygulamalar
   ============================================================ */

:root{
  color-scheme: light;
  --bg-1:#cfd9e8; --bg-2:#e7dcd0; --bg-3:#b9c6dd;
  --surface:rgba(255,255,255,.78);
  --surface-solid:#fcfcfb;
  --surface-2:rgba(0,0,0,.045);
  --surface-3:rgba(0,0,0,.075);
  --text:#14130f; --text-2:#52514e; --muted:#8a8985;
  --border:rgba(0,0,0,.12); --border-2:rgba(0,0,0,.07);
  --accent:#2a78d6; --accent-ink:#fff;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --good:#1baf7a; --warn:#eda100; --bad:#e34948;
  --shadow:0 18px 50px rgba(20,25,40,.28), 0 2px 8px rgba(20,25,40,.12);
  --radius:14px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg-1:#1b2333; --bg-2:#2a2431; --bg-3:#111722;
  --surface:rgba(30,32,38,.80);
  --surface-solid:#1a1a19;
  --surface-2:rgba(255,255,255,.06);
  --surface-3:rgba(255,255,255,.11);
  --text:#f4f3ef; --text-2:#c3c2b7; --muted:#8d8c85;
  --border:rgba(255,255,255,.14); --border-2:rgba(255,255,255,.08);
  --accent:#3987e5; --accent-ink:#fff;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --good:#199e70; --warn:#c98500; --bad:#e66767;
  --shadow:0 18px 50px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.4);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font-family:var(--font); color:var(--text);
  background:
    radial-gradient(120% 90% at 12% 8%, var(--bg-2) 0%, transparent 55%),
    radial-gradient(110% 100% at 88% 92%, var(--bg-3) 0%, transparent 60%),
    linear-gradient(150deg, var(--bg-1), var(--bg-3));
  background-attachment:fixed;
  overflow:hidden; -webkit-font-smoothing:antialiased;
  font-size:14px;
}
body[data-wall="mesh"]{background:
    radial-gradient(60% 60% at 20% 20%, #7aa8ff44, transparent 60%),
    radial-gradient(50% 50% at 80% 30%, #ff9d6e44, transparent 60%),
    radial-gradient(60% 60% at 50% 90%, #56d9a344, transparent 60%),
    linear-gradient(160deg, var(--bg-1), var(--bg-3));}
body[data-wall="plain"]{background:linear-gradient(170deg,var(--bg-1),var(--bg-3))}
body[data-wall="grid"]{background:
    linear-gradient(var(--border-2) 1px, transparent 1px) 0 0/32px 32px,
    linear-gradient(90deg, var(--border-2) 1px, transparent 1px) 0 0/32px 32px,
    linear-gradient(160deg, var(--bg-1), var(--bg-3));}

button,input,textarea,select{font:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:6px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}

/* ---------- 3. Menü çubuğu ---------- */
#menubar{
  position:fixed;top:0;left:0;right:0;height:30px;z-index:9000;
  display:flex;align-items:center;gap:14px;padding:0 12px;
  background:var(--surface);backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border-bottom:1px solid var(--border-2);font-size:12.5px;
}
#menubar .logo{font-weight:700;letter-spacing:.2px}
#menubar .mb-app{font-weight:600}
#menubar .spacer{flex:1}
#menubar .mb-item{display:flex;align-items:center;gap:5px;padding:3px 8px;border-radius:7px;cursor:pointer;white-space:nowrap}
#menubar .mb-item:hover{background:var(--surface-3)}
#menubar .pill{font-variant-numeric:tabular-nums}

/* ---------- 2. Masaüstü ---------- */
#desktop{position:fixed;inset:30px 0 0 0;overflow:hidden}
#icons{position:absolute;top:14px;left:14px;display:flex;flex-direction:column;flex-wrap:wrap;gap:4px;max-height:calc(100vh - 160px)}
.dicon{width:92px;padding:8px 4px;border-radius:10px;text-align:center;cursor:pointer;user-select:none}
.dicon:hover{background:var(--surface-2)}
.dicon.sel{background:color-mix(in srgb,var(--accent) 30%, transparent)}
.dicon .gl{font-size:30px;display:block;line-height:1.2;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
.dicon .lb{font-size:11.5px;margin-top:3px;color:var(--text);text-shadow:0 1px 3px rgba(0,0,0,.35)}
:root[data-theme="light"] .dicon .lb{text-shadow:0 1px 2px rgba(255,255,255,.7)}

/* ---------- 4. Dock ---------- */
#dock{
  position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:8000;
  display:flex;align-items:flex-end;gap:6px;padding:8px 10px;
  background:var(--surface);backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border:1px solid var(--border-2);border-radius:20px;box-shadow:var(--shadow);
  max-width:96vw;overflow-x:auto;scrollbar-width:none;
}
#dock::-webkit-scrollbar{display:none}
.dockicon{position:relative;width:44px;height:44px;flex:0 0 auto;display:grid;place-items:center;font-size:26px;
  border-radius:12px;cursor:pointer;transition:transform .16s cubic-bezier(.2,.8,.3,1),background .16s}
.dockicon:hover{transform:translateY(-9px) scale(1.22);background:var(--surface-2)}
.dockicon .dot{position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--text-2);opacity:0}
.dockicon.open .dot{opacity:1}
.dock-sep{width:1px;align-self:stretch;background:var(--border);margin:4px 3px}
.tip{position:absolute;bottom:56px;left:50%;transform:translateX(-50%);background:var(--surface-solid);border:1px solid var(--border);
  padding:3px 8px;border-radius:7px;font-size:11.5px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s;box-shadow:var(--shadow)}
.dockicon:hover .tip{opacity:1}

/* ---------- 5. Pencereler ---------- */
.win{
  position:absolute;display:flex;flex-direction:column;min-width:300px;min-height:200px;
  background:var(--surface);backdrop-filter:blur(28px) saturate(180%);
  -webkit-backdrop-filter:blur(28px) saturate(180%);
  border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);
  overflow:hidden;animation:pop .16s cubic-bezier(.2,.9,.3,1);
}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(6px)}to{opacity:1;transform:none}}
.win.min{display:none}
.win.max{border-radius:0}
.titlebar{touch-action:none;height:38px;flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:0 12px;cursor:default;
  border-bottom:1px solid var(--border-2);user-select:none;background:var(--surface-2)}
.lights{display:flex;gap:7px}
.light{width:12px;height:12px;border-radius:50%;cursor:pointer;border:1px solid rgba(0,0,0,.14);font-size:9px;line-height:10px;text-align:center;color:rgba(0,0,0,.55)}
.light.c{background:#ff5f57}.light.m{background:#febc2e}.light.z{background:#28c840}
.lights:not(:hover) .light{color:transparent}
.wtitle{font-size:13px;font-weight:600;flex:1;text-align:center;margin-right:52px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wbody{flex:1;overflow:auto;position:relative}
.resize{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;touch-action:none}
.win.dragging{transition:none;user-select:none}
.win.snapped{border-radius:0}
#snapghost{position:absolute;z-index:9998;pointer-events:none;border:2px solid var(--accent);border-radius:12px;
  background:color-mix(in srgb,var(--accent) 16%, transparent);
  transition:left .11s ease,top .11s ease,width .11s ease,height .11s ease}
#snapghost b{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;
  font-size:13px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.win.dragging .wbody{pointer-events:none}
.win.focus{box-shadow:0 24px 60px rgba(0,0,0,.45), 0 0 0 1px var(--border)}

/* ---------- 6. Ortak bileşenler ---------- */
.app{display:flex;flex-direction:column;height:100%;min-height:0}
.row{display:flex;gap:8px;align-items:center}
.col{display:flex;flex-direction:column;gap:8px}
.pad{padding:14px}
.grow{flex:1;min-width:0;min-height:0}
.scroll{overflow:auto;min-height:0}
.toolbar{display:flex;gap:8px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--border-2);flex-wrap:wrap;flex:0 0 auto}
.sidebar{width:186px;flex:0 0 auto;border-right:1px solid var(--border-2);overflow:auto;padding:8px}
.btn{background:var(--surface-3);border:1px solid var(--border-2);border-radius:9px;padding:6px 11px;cursor:pointer;font-size:13px;transition:.12s;white-space:nowrap}
.btn:hover{background:var(--surface-2);border-color:var(--border)}
.btn.pri{background:var(--accent);border-color:transparent;color:var(--accent-ink);font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.sm{padding:3px 8px;font-size:12px;border-radius:7px}
.btn.danger{color:var(--bad)}
.inp,select.inp,textarea.inp{background:var(--surface-solid);border:1px solid var(--border);border-radius:9px;padding:7px 10px;font-size:13px;outline:none;width:100%}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
textarea.inp{resize:none;line-height:1.6}
.item{padding:7px 9px;border-radius:9px;cursor:pointer;font-size:13px;display:flex;gap:8px;align-items:center}
.item:hover{background:var(--surface-2)}
.item.sel{background:var(--surface-3);font-weight:600}
.card{background:var(--surface-2);border:1px solid var(--border-2);border-radius:12px;padding:12px}
.h1{font-size:19px;font-weight:700;margin:0}
.h2{font-size:14px;font-weight:700;margin:0}
.sub{font-size:12px;color:var(--muted)}
.tag{font-size:11px;padding:2px 7px;border-radius:20px;background:var(--surface-3);color:var(--text-2);white-space:nowrap}
.dotc{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.empty{padding:38px 20px;text-align:center;color:var(--muted);font-size:13px;line-height:1.7}
.sep{height:1px;background:var(--border-2);margin:8px 0}
.kbd{font:11px var(--mono);background:var(--surface-3);border:1px solid var(--border-2);border-radius:5px;padding:1px 5px}
.checkbox{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--muted);display:grid;place-items:center;cursor:pointer;flex:0 0 auto;font-size:11px;color:transparent}
.checkbox.on{background:var(--good);border-color:var(--good);color:#fff}
.pop{position:fixed;z-index:9500;background:var(--surface-solid);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:170px}
#toasts{position:fixed;bottom:78px;right:14px;z-index:9600;display:flex;flex-direction:column;gap:8px;pointer-events:none;align-items:flex-end}
.toast{background:var(--surface-solid);border:1px solid var(--border);border-radius:12px;padding:10px 14px;box-shadow:var(--shadow);font-size:13px;animation:pop .2s;max-width:290px}
</style>
</head>
<body data-wall="mesh">
<style>
/* ---------- 7. Uygulamaya özel ---------- */
/* Notlar */
.note-ed{flex:1;border:none;background:transparent;padding:16px 20px;font-size:14.5px;line-height:1.75;resize:none;outline:none;font-family:var(--font)}
.md-prev{padding:16px 20px;line-height:1.75;overflow:auto}
.md-prev h1{font-size:21px;margin:.6em 0 .3em}.md-prev h2{font-size:17px;margin:.6em 0 .3em}.md-prev h3{font-size:15px;margin:.6em 0 .3em}
.md-prev code{font:12.5px var(--mono);background:var(--surface-3);padding:1px 5px;border-radius:5px}
.md-prev pre{background:var(--surface-3);padding:10px 12px;border-radius:10px;overflow:auto}
.md-prev pre code{background:none;padding:0}
.md-prev blockquote{border-left:3px solid var(--accent);margin:.6em 0;padding:2px 0 2px 12px;color:var(--text-2)}
.md-prev mark{background:color-mix(in srgb,var(--s4) 45%,transparent);color:inherit;padding:0 3px;border-radius:3px}
.md-prev ul,.md-prev ol{padding-left:22px}
.md-prev hr{border:none;border-top:1px solid var(--border);margin:1em 0}
.md-prev table{border-collapse:collapse}.md-prev td,.md-prev th{border:1px solid var(--border);padding:5px 9px}
/* Kartlar */
.flash{flex:1;display:grid;place-items:center;padding:22px;text-align:center}
.flash-card{width:100%;max-width:520px;min-height:190px;display:grid;place-items:center;padding:26px;
  background:var(--surface-solid);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);
  font-size:18px;line-height:1.6;cursor:pointer}
/* Kart metni satır sonlarını korur; kartın tamamında pre-wrap olunca şablondaki
   girintiler de boşluk olarak çiziliyor ve yüz gereksiz uzuyordu. */
.flash-card .ftext{margin-top:10px;white-space:pre-wrap}
.flash-card .side{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
/* Yüzde yalnızca görsel varsa kart metin kadar yer ayırmasın: asgari yükseklik
   ve iç boşluk küçülür, görsel kartın kendisi kadar büyür. */
.flash-card.img-only{min-height:0;padding:14px}
.flash-card.img-only .cardimg{max-height:min(52vh,460px);margin-bottom:6px}
.grade{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
/* Pomodoro */
.timer{font:600 66px/1 var(--font);font-variant-numeric:tabular-nums;letter-spacing:-2px}
.ring{--p:0;width:210px;height:210px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--accent) calc(var(--p)*1%), var(--surface-3) 0);position:relative}
.ring::after{content:"";position:absolute;inset:11px;border-radius:50%;background:var(--surface-solid)}
.ring>*{position:relative;z-index:1}
/* Takvim */
.cal{display:grid;grid-template-columns:46px repeat(7,1fr);font-size:11.5px;min-width:620px}
.cal .hd{position:sticky;top:0;background:var(--surface);backdrop-filter:blur(12px);padding:6px 2px;text-align:center;font-weight:600;border-bottom:1px solid var(--border-2);z-index:2}
.cal .hr{color:var(--muted);text-align:right;padding:0 6px;height:34px;border-top:1px solid var(--border-2);font-size:10.5px}
.cal .cell{height:34px;border-top:1px solid var(--border-2);border-left:1px solid var(--border-2);position:relative;cursor:pointer}
.cal .cell:hover{background:var(--surface-2)}
.ev{position:absolute;inset:1px;border-radius:7px;padding:3px 6px;font-size:11px;color:#fff;overflow:hidden;z-index:1;line-height:1.3}
/* Konu haritası */
.tree-node{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:8px}
.tree-node:hover{background:var(--surface-2)}
.st{width:10px;height:10px;border-radius:3px;flex:0 0 auto;cursor:pointer}
.st.new{background:var(--surface-3);border:1px solid var(--border)}
.st.learning{background:var(--s4)}.st.known{background:var(--good)}
/* İstatistik / grafikler */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.hero{font:700 34px/1 var(--font);font-variant-numeric:tabular-nums;letter-spacing:-1px}
.meter{height:9px;border-radius:6px;background:var(--surface-3);overflow:hidden}
.meter>i{display:block;height:100%;border-radius:6px;background:var(--s1)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:12px;height:12px;border-radius:3px;background:var(--surface-3);display:block}
.bar{fill:var(--s1)}
.axis{font-size:10px;fill:var(--muted)}
.gridline{stroke:var(--border-2);stroke-width:1}
/* Quiz */
.choice{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border:1px solid var(--border);border-radius:11px;cursor:pointer;background:var(--surface-solid);line-height:1.5}
.choice:hover{border-color:var(--accent)}
.choice.pick{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.choice.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface-solid))}
.choice.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface-solid))}
.choice b{flex:0 0 auto;width:20px}
/* Terminal */
.term{background:#0e1116;color:#d6e0ea;font:13px/1.65 var(--mono);padding:12px;height:100%;overflow:auto}
.term .in{background:transparent;border:none;outline:none;color:#7ee0a8;font:inherit;width:100%}
.term .pr{color:#7ee0a8}
.term .er{color:#ff8f8f}.term .ok{color:#8fd6ff}.term .dim{color:#7d8896}
/* Odak modu */
/* Koyu bir karartının DOĞRUDAN üstünde duran denetimler. Tema renkleri burada
   işe yaramaz: açık temada --text neredeyse siyah, .btn zemini rgba(0,0,0,.075);
   ikisi de karartıda kaybolur (çizim tahtasının "Kapat" düğmesi görünmüyordu).
   Bu yüzden kendi renklerini taşırlar. Bir kutunun İÇİNDEKİ denetimlere verme —
   orada tema renkleri doğru (bkz. bigNotice). */
.onDark{color:#f2f2ee}
.onDark .btn{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.32);color:#f2f2ee}
.onDark .btn:hover{background:rgba(255,255,255,.26);border-color:rgba(255,255,255,.5)}
.onDark .btn.danger{color:#ff9b93}
.onDark .btn.pri{background:var(--accent);border-color:transparent;color:#fff}
.onDark .sub{color:rgba(242,242,238,.75)}
.onDark .inp{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:#f2f2ee}
/* açılır listenin şıkları işletim sistemi tarafından çizilir: tema renkleri kalsın */
.onDark .inp option{background:var(--surface-solid);color:var(--text)}
/* Döndürülünce de ekrana sığsın diye iki kenar da küçük olan ölçüye göre sınırlanır. */
.rotimg{max-width:min(84vw,84vh);max-height:min(84vw,84vh);object-fit:contain;border-radius:10px;
  transition:transform .18s ease;box-shadow:0 20px 50px rgba(0,0,0,.55)}
.md-prev img[data-media]{cursor:zoom-in}
#focusOverlay{position:fixed;inset:0;z-index:9400;background:rgba(8,10,14,.94);display:none;place-items:center;color:#f2f2ee;text-align:center}
#focusOverlay.on{display:grid}
#focusOverlay .ft{font:200 96px/1 var(--font);font-variant-numeric:tabular-nums}
/* Günlük */
.mood{font-size:22px;cursor:pointer;opacity:.35;transition:.15s;background:none;border:none;padding:2px}
.mood.on{opacity:1;transform:scale(1.2)}
/* Masaüstü widget'ları */
#widgets{position:absolute;top:14px;right:14px;width:252px;display:flex;flex-direction:column;gap:10px;z-index:5;max-height:calc(100% - 96px);overflow:auto;scrollbar-width:none}
#widgets::-webkit-scrollbar{display:none}
.wg{background:var(--surface);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);
  border:1px solid var(--border-2);border-radius:16px;padding:13px;box-shadow:0 10px 30px rgba(0,0,0,.20)}
.wg .wgh{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--text-2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:9px}
.wg .big{font:700 27px/1 var(--font);font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.wg .rowi{display:flex;gap:7px;align-items:center;padding:4px 0;font-size:12.5px}
.wg.clickable{cursor:pointer;transition:transform .15s}
.wg.clickable:hover{transform:translateY(-2px)}
/* Spotlight */
#spot{position:fixed;inset:0;z-index:9550;background:rgba(0,0,0,.35);display:none;padding-top:13vh;justify-content:center;backdrop-filter:blur(3px)}
#spot.on{display:flex}
#spotbox{width:min(640px,94vw);height:max-content;max-height:70vh;background:var(--surface);backdrop-filter:blur(30px) saturate(180%);

<script>
"use strict";
/* ============================================================
   ÇEKİRDEK: depolama, yardımcılar, pencere yöneticisi
   ============================================================ */
const KEY="studyos.v1";
const VERSION="3.6", VERSION_DATE="2026-09-13";   /* Ayarlar ve terminalde görünür */
const uid=()=>Math.random().toString(36).slice(2,10);
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const pad=n=>String(n).padStart(2,"0");
/* Tarihler YEREL takvime göre üretilir. toISOString() UTC verir; UTC+3'te gece
   00:00-02:59 arası yapılan her kayıt bir önceki güne düşer, seri kırılır. */
const ymd=d=>{const x=d==null?new Date():new Date(d);
  return x.getFullYear()+"-"+pad(x.getMonth()+1)+"-"+pad(x.getDate());};
const today=()=>ymd();
const dayKey=d=>ymd(d);
const addDays=(dstr,n)=>{const d=new Date(dstr+"T12:00:00");d.setDate(d.getDate()+n);return ymd(d);};
const dayDiff=(a,b)=>Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5);
const fmtMin=m=>m>=60?`${Math.floor(m/60)}s ${m%60}dk`:`${m}dk`;
const trDay=["Pzt","Sal","Çar","Per","Cum","Cmt","Paz"];
const COLORS=["#2a78d6","#eb6834","#1baf7a","#eda100","#e87ba4","#4a3aa7","#e34948","#008300"];

let DB=null;
let _saveT=null,_dirty=false,_quotaAt=0;
let SAVE_FAILED=false;     /* son yazma başarısız mı — menü çubuğunda ve widget'ta görünür */
let LOCK_SAVE=false;       /* bozuk veri / sekme çakışması: karar verilene dek KEY'e dokunma */
/* uyarı göstergelerini tazele — açılışın erken anında henüz tanımlı olmayabilirler */
function alarmUI(){ try{ updateMenubar(); paintWidgets(); }catch(e){} }
function save(){ _dirty=true; clearTimeout(_saveT);
  _saveT=setTimeout(()=>{ window.requestIdleCallback?requestIdleCallback(flush,{timeout:1200}):flush(); },250); }
function flush(){
  if(LOCK_SAVE||!_dirty) return; _dirty=false; clearTimeout(_saveT);
  try{ localStorage.setItem(KEY,JSON.stringify(DB));
    if(SAVE_FAILED){ SAVE_FAILED=false; alarmUI(); } }
  catch(e){
    _dirty=true;                     /* veri hâlâ yazılmadı; sonraki denemede tekrar denensin */
    const ilk=!SAVE_FAILED; SAVE_FAILED=true;
    /* uyarı bir kez gösterilip susmaz — en fazla 60 sn'de bir tekrarlanır */
    if(ilk||Date.now()-_quotaAt>60000){ _quotaAt=Date.now();
      toast("⚠️ KAYDEDİLEMİYOR — metin deposu dolu. Ayarlar → Veri'den yedek al."); }
    if(ilk) alarmUI();
  }
}
/* flush() yalnızca bekleyen değişiklik varsa yazar; içe aktarma gibi DB'yi
   toptan değiştiren yerlerde bayrağı elle kaldırmak gerekir */
function saveNow(){ _dirty=true; flush(); }
window.addEventListener("beforeunload",flush);
document.addEventListener("visibilitychange",()=>{ if(document.hidden) flush(); });
let CORRUPT_RAW=null, CORRUPT_ERR="", CORRUPT_SAVED=false;
function load(){
  let raw=null;
  try{ raw=localStorage.getItem(KEY); }catch(e){}
  if(raw){
    try{
      const d=JSON.parse(raw), base=blank();
      DB=Object.assign(base,d);
      DB.settings=Object.assign(base.settings,d.settings||{});  /* yeni ayarlar eksik kalmasın */
      return;
    }catch(e){
      /* Veri bozuk. Örnek veriyle EZME: ham metni sakla, yazmayı kilitle, kullanıcıya sor. */
      CORRUPT_RAW=raw; CORRUPT_ERR=e.message||String(e);
      try{ localStorage.setItem(KEY+".bozuk",raw); CORRUPT_SAVED=true; }catch(e2){}
      LOCK_SAVE=true;
      DB=blank();
      return;
    }
  }
  DB=seed(); save();
}
function blank(){
  return {v:2, terms:[], settings:{theme:"dark", wall:"mesh", name:"", pomo:25, brk:5, goal:120, widgets:true, autoOpen:""},
    courses:[], notes:[], decks:[], cards:[], tasks:[], sessions:[], topics:[],
    quizzes:[], quizRuns:[], events:[], journal:[], exams:[], files:[], trash:[]};
}
function seed(){
  const d=blank(); const t=today();
  const c1={id:uid(),name:"Matematik",color:COLORS[0]};
  const c2={id:uid(),name:"Biyoloji",color:COLORS[2]};
  const c3={id:uid(),name:"Tarih",color:COLORS[1]};
  d.courses=[c1,c2,c3];
  d.notes=[{id:uid(),courseId:c1.id,title:"Türev — temel kurallar",
    body:"# Türev\n\n**Tanım:** f'(x) = lim(h→0) [f(x+h) − f(x)] / h\n\n## Kurallar\n- Kuvvet: (x^n)' = n·x^(n-1)\n- Çarpım: (u·v)' = u'v + uv'\n- Bölüm: (u/v)' = (u'v − uv') / v²\n\n> ==Zincir kuralı== en çok unutulan yer: (f(g(x)))' = f'(g(x))·g'(x)\n\n`Not:` Bu notu silip kendi notlarını yazabilirsin.",
    created:t,updated:t}];
  const dk={id:uid(),name:"Biyoloji — Hücre",courseId:c2.id};
  d.decks=[dk];
  d.cards=[
    {id:uid(),deckId:dk.id,front:"Mitokondri ne yapar?",back:"Hücrenin enerji (ATP) üretim merkezidir.",ef:2.5,int:0,reps:0,lapses:0,due:t},
    {id:uid(),deckId:dk.id,front:"Ribozom görevi?",back:"Protein sentezi yapar.",ef:2.5,int:0,reps:0,lapses:0,due:t},
    {id:uid(),deckId:dk.id,front:"Hücre zarının yapısı?",back:"Akıcı mozaik model: fosfolipit çift tabaka + proteinler.",ef:2.5,int:0,reps:0,lapses:0,due:t}];
  d.tasks=[
    {id:uid(),courseId:c1.id,title:"Türev soru bankası 40 soru",done:false,pri:2,due:addDays(t,1),created:t},
    {id:uid(),courseId:c2.id,title:"Hücre bölünmesi konu tekrarı",done:false,pri:1,due:addDays(t,3),created:t},
    {id:uid(),courseId:c3.id,title:"Kurtuluş Savaşı kronoloji çıkar",done:true,pri:0,due:t,created:t}];
  const r1={id:uid(),courseId:c1.id,parentId:null,name:"Analiz",status:"learning"};
  d.topics=[r1,
    {id:uid(),courseId:c1.id,parentId:r1.id,name:"Limit",status:"known"},
    {id:uid(),courseId:c1.id,parentId:r1.id,name:"Türev",status:"learning"},
    {id:uid(),courseId:c1.id,parentId:r1.id,name:"İntegral",status:"new"},
    {id:uid(),courseId:c2.id,parentId:null,name:"Hücre",status:"learning"}];
  d.quizzes=[{id:uid(),name:"Hücre — hızlı test",courseId:c2.id,questions:[
    {q:"ATP üretiminin ana merkezi hangisidir?",ch:["Ribozom","Mitokondri","Golgi","Lizozom"],a:1,ex:"Mitokondri oksijenli solunumla ATP üretir."},
    {q:"Protein sentezi nerede gerçekleşir?",ch:["Ribozom","Koful","Sentrozom","Çekirdekçik"],a:0,ex:"Ribozomlar protein sentezinin yapıldığı organeldir."}]}];
  d.events=[{id:uid(),day:0,start:18,end:20,courseId:c1.id,title:"Matematik tekrar"},
            {id:uid(),day:2,start:19,end:20,courseId:c2.id,title:"Biyoloji kart"}];
  for(let i=1;i<=6;i++){ d.sessions.push({id:uid(),courseId:[c1,c2,c3][i%3].id,date:addDays(t,-i),min:[50,25,75,25,50,25][i-1],kind:"focus"}); }
  d.sessions.push({id:uid(),courseId:c1.id,date:t,min:25,kind:"focus"});
  d.exams=[{id:uid(),courseId:c1.id,name:"Matematik deneme sınavı",date:addDays(t,14)}];
  d.terms=[{id:uid(),term:"Mitokondri",alt:["mitokondriyal"],courseId:c2.id,noteId:"",
    def:"Hücrenin enerji santrali; oksijenli solunumla ATP üretir. Kendi DNA'sı vardır."},
    {id:uid(),term:"Türev",alt:["türevi"],courseId:c1.id,noteId:"",
     def:"Bir fonksiyonun bir noktadaki anlık değişim hızı; grafiğin o noktadaki teğetinin eğimi."}];
  d.journal=[{date:t,mood:3,text:"StudyOS'a hoş geldin. Bugün ne öğrendiğini buraya yaz."}];
  return d;
}
/* uzun listeleri kırp: DOM şişince tüm arayüz yavaşlar */
const CAP=150;
const capped=arr=>arr.length>CAP?arr.slice(0,CAP):arr;
const capNote=(arr,what)=>arr.length>CAP
  ? `<div class="sub" style="padding:10px;text-align:center">… ve ${arr.length-CAP} ${what} daha — bulmak için aramayı kullan</div>`:"";
const course=id=>DB.courses.find(c=>c.id===id);
const cname=id=>course(id)?.name||"Genel";
const ccolor=id=>course(id)?.color||"var(--muted)";
function toast(msg){ const t=el("div","toast",esc(msg)); $("#toasts").appendChild(t);
  setTimeout(()=>{t.style.transition="opacity .3s";t.style.opacity="0";setTimeout(()=>t.remove(),300)},2600); }

/* ============================================================
   MEDYA DEPOSU (IndexedDB) — görseller/dosyalar localStorage'ı
   doldurmasın diye ayrı tutulur. Referans biçimi: "idb:<id>"
   ============================================================ */
let _idb=null, IDB_BYTES=0;
const MEDIA_URL=new Map();           // id -> objectURL (önbellek)
function idb(){
  return new Promise((res,rej)=>{
    if(_idb) return res(_idb);
    const r=indexedDB.open("studyos",3);
    r.onupgradeneeded=()=>{ const d=r.result;
      if(!d.objectStoreNames.contains("media"))   d.createObjectStore("media");
      if(!d.objectStoreNames.contains("handles")) d.createObjectStore("handles");
      if(!d.objectStoreNames.contains("snaps"))   d.createObjectStore("snaps"); };
    r.onsuccess=()=>{ _idb=r.result; res(_idb); };
    r.onerror=()=>rej(r.error);
  });
}
function idbOp(mode,fn,store="media"){
  return idb().then(db=>new Promise((res,rej)=>{
    const tx=db.transaction(store,mode), st=tx.objectStore(store);
    const rq=fn(st); tx.onerror=()=>rej(tx.error); tx.oncomplete=()=>res(rq&&rq.result);
  }));
}
const idbPut=(id,blob)=>idbOp("readwrite",st=>st.put(blob,id));
const idbGet=id=>idbOp("readonly",st=>st.get(id));
const idbDel=id=>idbOp("readwrite",st=>st.delete(id));
const idbKeys=()=>idbOp("readonly",st=>st.getAllKeys());
function dataURLtoBlob(u){
  const [h,b]=u.split(","); const mime=(h.match(/:(.*?);/)||[,"application/octet-stream"])[1];
  if(!/;base64/.test(h)) return new Blob([decodeURIComponent(b)],{type:mime});
  const bin=atob(b), arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:mime});
}
function blobToDataURL(b){ return new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(b); }); }
/* dataURL veya Blob al, sakla, "idb:<id>" referansı döndür */
async function putMedia(src){
  const id="m"+uid()+uid();
  const blob=typeof src==="string"?dataURLtoBlob(src):src;
  await idbPut(id,blob); IDB_BYTES+=blob.size;
  MEDIA_URL.set(id,URL.createObjectURL(blob));
  return "idb:"+id;
}
async function mediaURL(ref){
  if(!ref) return "";
  if(!ref.startsWith("idb:")) return ref;           // eski data: veya http: referansları
  const id=ref.slice(4);
  if(MEDIA_URL.has(id)) return MEDIA_URL.get(id);
  const blob=await idbGet(id);
  if(!blob) return "";
  const u=URL.createObjectURL(blob); MEDIA_URL.set(id,u); return u;
}
function dropMedia(ref){ if(ref&&ref.startsWith("idb:")){ const id=ref.slice(4);
  const u=MEDIA_URL.get(id); if(u)URL.revokeObjectURL(u); MEDIA_URL.delete(id); idbDel(id).catch(()=>{}); } }
/* <img data-media="idb:..."> etiketlerini gerçek kaynağa bağla */
function hydrateMedia(root){
  $$("[data-media]",root).forEach(async n=>{
    const ref=n.dataset.media; if(!ref) return;
    const u=await mediaURL(ref);
    if(u){ n.src=u; } else { n.replaceWith(el("span","sub","⚠️ görsel bulunamadı")); }
  });
}
const mediaImg=(ref,cls,style)=>ref?`<img ${ref.startsWith("idb:")?`data-media="${ref}"`:`src="${esc(ref)}"`} class="${cls||""}" style="${style||""}" alt="">`:"";
async function idbUsage(){ try{ const ks=await idbKeys(); let n=0;
  for(const k of ks){ const b=await idbGet(k); n+=b?.size||0; } IDB_BYTES=n; return n; }catch(e){ return 0; } }

/* ---- cihazdaki dosyaya canlı bağlantı (masaüstü Chrome/Edge) ----
   Dosya diskte kalır; burada yalnızca tutamaç saklanır, açarken izin istenir. */
const canLinkFiles=()=>typeof window.showOpenFilePicker==="function";
async function pickDeviceFile(){
  const [h]=await window.showOpenFilePicker({multiple:false});
  const hid="h"+uid()+uid();
  await idbOp("readwrite",st=>st.put(h,hid),"handles");
  return {name:h.name,hid};
}
/* Dosyayı kopyalamadan "işaretle": sadece adı/türü saklanır, açarken
   dosya seçici açılır ve dosyanın o anki hali gösterilir. Her yerde çalışır. */
function openFileRef(a){
  /* accept KOYMUYORUZ: bazı Android dosya seçicileri filtreyle sadece
     indirilenleri gösteriyor, tam dosya yöneticisi açılmıyor */
  const i=el("input"); i.type="file";
  i.onchange=()=>{ const f=i.files[0]; if(!f) return;
    if(a.name&&f.name!==a.name) toast(`Farklı dosya seçtin: ${f.name}`);
    openViewer(f); };
  i.click();
}
const HANDLE_CACHE=new Map();   /* hid -> {file, at} : oturum boyunca */
async function readDeviceFile(hid){
  const h=await idbOp("readonly",st=>st.get(hid),"handles");
  if(!h) throw new Error("bağlantı yok");
  let perm=await h.queryPermission?.({mode:"read"});
  if(perm!=="granted") perm=await h.requestPermission?.({mode:"read"});
  if(perm&&perm!=="granted") throw new Error("izin verilmedi");
  const f=await h.getFile();
  HANDLE_CACHE.set(hid,{file:f,at:Date.now()});
  return f;
}
/* fresh=true ise diskten yeniden okur (izin sorabilir),
   değilse bu oturumda okunmuş kopyayı kullanır (izin sormaz) */
async function openDeviceFile(hid,fresh){
  try{
    const hit=HANDLE_CACHE.get(hid);
    const f=(!fresh&&hit)?hit.file:await readDeviceFile(hid);
    return openViewer(f,null,{hid,at:(HANDLE_CACHE.get(hid)||{}).at});
  }catch(e){
    const m=String(e&&e.message||e);
    toast(m==="izin verilmedi"?"Dosyaya erişim izni verilmedi"
        :m==="bağlantı yok"?"⚠️ Dosya bağlantısı kayboldu"
        :"⚠️ Dosya bulunamadı — taşınmış veya silinmiş olabilir");
  }
}

/* ---- eski sürümden taşıma: gömülü data: URL'lerini IndexedDB'ye al ---- */
async function migrateMedia(){
  if(DB.v>=2){ return; }
  let moved=0;
  try{
    for(const c of DB.cards) if(c.img&&c.img.startsWith("data:")){ c.img=await putMedia(c.img); moved++; }
    for(const n of DB.notes){
      const hits=[...n.body.matchAll(/\]\((data:[^)]+)\)/g)];
      for(const h of hits){ const ref=await putMedia(h[1]); n.body=n.body.split(h[1]).join(ref); moved++; }
      for(const a of (n.att||[])) if(a.data){ a.ref=await putMedia(a.data); delete a.data; moved++; }
    }
    DB.v=2; flush();
    if(moved) toast(`${moved} medya dosyası kalıcı depoya taşındı`);
  }catch(e){ console.warn("taşıma hatası",e); }
}

/* --------- modal diyalog (prompt yerine) --------- */
function dialog(title,fields){
  return new Promise(res=>{
    const box=$("#modal"); $("#modaltitle").textContent=title;
    $("#modalfields").innerHTML=fields.map(f=>{
      if(f.type==="select") return `<div class="fl"><label>${esc(f.label)}</label>
        <select class="inp" data-f="${f.k}">${f.options.map(o=>`<option value="${esc(o.v)}" ${o.v==f.value?"selected":""}>${esc(o.l)}</option>`).join("")}</select></div>`;
      return `<div class="fl"><label>${esc(f.label)}</label>
        <input class="inp" data-f="${f.k}" type="${f.type||"text"}" value="${esc(f.value??"")}" ${f.min!=null?`min="${f.min}"`:""} ${f.max!=null?`max="${f.max}"`:""} placeholder="${esc(f.ph||"")}"></div>`;
    }).join("");
    box.classList.add("on");
    const first=$("#modalfields .inp"); setTimeout(()=>first?.focus(),40);
    const done=v=>{ box.classList.remove("on"); $("#modalok").onclick=null; $("#modalcancel").onclick=null;
      box.onclick=null; $("#modalfields").onkeydown=null; res(v); };
    const ok=()=>{ const out={}; $$("#modalfields [data-f]").forEach(i=>out[i.dataset.f]=i.value); done(out); };
    $("#modalok").onclick=ok;
    $("#modalcancel").onclick=()=>done(null);
    box.onclick=e=>{ if(e.target===box) done(null); };
    $("#modalfields").onkeydown=e=>{ if(e.key==="Enter")ok(); if(e.key==="Escape")done(null); };
  });
}
function confirmBox(msg){ return confirm(msg); }

function downloadText(txt,name,mime){
  const a=el("a"); a.href=URL.createObjectURL(new Blob([txt],{type:mime||"application/json"}));
  a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}
/* ============================================================
   GERİ DÖNÜŞ YOLLARI
   Anlık görüntü: IndexedDB "snaps" deposunda, YALNIZCA metin DB'si.
     Medya bilerek dışarıda — 7 kopya blob'ları çoğaltıp kotayı patlatırdı,
     zaten bozulan/kaybolan taraf metin.
   Çöp kutusu: DB.trash, 30 gün. Medya ancak kalıcı silinince bırakılır.
   ============================================================ */
const SNAP_GUNLUK=7, SNAP_ETIKET=3;
const SNAP_AD={gunluk:"günlük",import:"içe aktarmadan önce",reset:"sıfırlamadan önce",
  restore:"geri almadan önce",elle:"elle alındı"};
const snapPut=(k,v)=>idbOp("readwrite",st=>st.put(v,k),"snaps");
const snapAll=()=>idbOp("readonly",st=>st.getAll(),"snaps").then(a=>(a||[]).sort((x,y)=>y.ts-x.ts));
const snapDel=k=>idbOp("readwrite",st=>st.delete(k),"snaps");
async function takeSnapshot(reason){
  try{
    const json=JSON.stringify(DB), ts=Date.now(), key="s"+ts+"-"+uid().slice(0,4);
    await snapPut(key,{key,ts,date:today(),reason:reason||"gunluk",size:json.length,
      notes:DB.notes.length,cards:DB.cards.length,json});
    await pruneSnapshots();
    return true;
  }catch(e){ console.warn("anlık görüntü alınamadı",e); return false; }
}
/* son SNAP_GUNLUK günlük + son SNAP_ETIKET etiketli tutulur */
async function pruneSnapshots(){
  const all=await snapAll();
  const g=all.filter(x=>x.reason==="gunluk"), e=all.filter(x=>x.reason!=="gunluk");
  for(const x of [...g.slice(SNAP_GUNLUK),...e.slice(SNAP_ETIKET)]) await snapDel(x.key).catch(()=>{});
}
async function snapBytes(){ try{ return (await snapAll()).reduce((a,x)=>a+(x.size||0),0); }catch(e){ return 0; } }
async function dailySnapshot(){
  if(DB.settings.lastSnap===today()||LOCK_SAVE) return;
  if(await takeSnapshot("gunluk")){ DB.settings.lastSnap=today(); save(); }
}

const COP_GUN=30, COP_BAYT=300000;
const COP_AD={note:"Not",card:"Kart",deck:"Deste",task:"Görev",quiz:"Test",
  topic:"Konu",term:"Terim",course:"Ders",exam:"Sınav"};
const COP_DIZI={note:"notes",card:"cards",task:"tasks",quiz:"quizzes",
  term:"terms",course:"courses",exam:"exams"};
function toTrash(type,label,data){
  (DB.trash=DB.trash||[]).push({id:uid(),type,at:today(),ts:Date.now(),label:String(label||"").slice(0,120),data});
  trimTrash();
}
/* çöpteki kaydın tuttuğu medya — yalnızca kalıcı silinince bırakılır */
function trashRefs(e){
  const out=[], nota=x=>{ if(!x) return;
    (String(x.body||"").match(/idb:[a-z0-9]+/g)||[]).forEach(r=>out.push(r));
    (x.att||[]).forEach(a=>{ if(a.ref) out.push(a.ref); }); };
  if(e.type==="note") nota(e.data);
  else if(e.type==="card"||e.type==="term"){ if(e.data?.img) out.push(e.data.img);
    if(e.data?.imgB) out.push(e.data.imgB); }                     /* kartın iki yüzü de olabilir */
  else if(e.type==="deck") (e.data?.cards||[]).forEach(c=>{
    if(c.img) out.push(c.img); if(c.imgB) out.push(c.imgB); });
  return out;
}
/* 30 günü geçenleri ve 300 KB'ı aşan fazlalığı kalıcı siler — çöp,
   5 MB'lık metin deposunu yemesin */
function trimTrash(){
  if(!DB.trash?.length) return 0;
  const sinir=addDays(today(),-COP_GUN), kalan=[], atilan=[];
  for(const e of DB.trash) (e.at<sinir?atilan:kalan).push(e);
  DB.trash=kalan;
  while(DB.trash.length&&JSON.stringify(DB.trash).length>COP_BAYT) atilan.push(DB.trash.shift());
  atilan.forEach(e=>trashRefs(e).forEach(dropMedia));
  return atilan.length;
}
function restoreTrash(id){
  const i=(DB.trash||[]).findIndex(e=>e.id===id); if(i<0) return null;
  const e=DB.trash.splice(i,1)[0], d=e.data;
  if(e.type==="deck"){ DB.decks.push(d.deck); DB.cards.push(...(d.cards||[])); }
  else if(e.type==="topic"){ DB.topics.push(...(d.topics||[])); }
  else DB[COP_DIZI[e.type]].push(d);
  return e;
}
function dropTrash(id){
  const i=(DB.trash||[]).findIndex(e=>e.id===id); if(i<0) return;
  trashRefs(DB.trash[i]).forEach(dropMedia); DB.trash.splice(i,1);
}

    govde+`<div class="sub" style="margin-top:10px">Her gün ilk açılışta kendiliğinden alınır;
      son ${SNAP_GUNLUK} günlük ve ${SNAP_ETIKET} etiketli kopya tutulur.
      <b>Görseller dahil değildir</b> — geri dönünce aradan silinmiş bir görsel boş görünebilir.
      Tam kopya için JSON yedek al.</div>`,
    [{label:"📸 Şimdi al",run:async c=>{ c(); await takeSnapshot("elle"); toast("Anlık görüntü alındı"); snapScreen(); }},
     {label:"Kapat",pri:true,run:c=>c()}]);
  $$("[data-geri]",o).forEach(b=>b.onclick=()=>{ o.remove(); restoreSnapshot(b.dataset.geri); });
  $$("[data-sil]",o).forEach(b=>b.onclick=async()=>{ o.remove(); await snapDel(b.dataset.sil); snapScreen(); });
}
async function restoreSnapshot(key){
  let x=null; try{ x=(await snapAll()).find(y=>y.key===key); }catch(e){}
  if(!x){ toast("⚠️ Anlık görüntü bulunamadı"); return; }
  if(!confirm(`${x.date} tarihli hale dönülecek (${x.notes} not, ${x.cards} kart).\n\n`+
    `Şu anki hal önce ayrı bir anlık görüntüye alınır, geri dönebilirsin.\n\nDevam edilsin mi?`)) return;
  await takeSnapshot("restore");
  try{
    const d=JSON.parse(x.json);
    DB=Object.assign(blank(),d);
    DB.settings=Object.assign(blank().settings,d.settings||{});
    saveNow(); buildTerms(); applySettings(); refreshAll();
    toast(`${x.date} tarihli hale dönüldü`);
  }catch(e){ toast("⚠️ Anlık görüntü okunamadı"); }
}

  const tekrar=()=>{ save(); refreshAll(); sonra?.(); };
  const govde=list.length
    ? `<div style="max-height:42vh;overflow:auto;margin-top:6px">${capped(list).map(e=>`

          <span class="grow" style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(e.label||"—")}</span>
          <span class="sub">${esc(e.at)}</span>

          <button class="btn sm danger" data-sil="${e.id}">✕</button>
        </div>`).join("")}${list.length>CAP?`<div class="sub" style="padding:8px;text-align:center">… ve ${list.length-CAP} kayıt daha (en yeniler gösteriliyor)</div>`:""}</div>`
    : `<div class="sub" style="margin-top:6px">Çöp kutusu boş.</div>`;
  const o=bigNotice("🗑 Çöp kutusu",
    govde+`<div class="sub" style="margin-top:10px">Kayıtlar ${COP_GUN} gün sonra kendiliğinden
      kalıcı silinir. Görseller ancak o zaman bırakılır.</div>`,
    [...(list.length?[{label:"Tümünü boşalt",danger:true,run(c){
        if(!confirm("Çöp kutusundaki her şey kalıcı silinsin mi? Bu geri alınamaz.")) return;
        [...DB.trash].forEach(e=>dropTrash(e.id)); c(); tekrar(); toast("Çöp kutusu boşaltıldı"); }}]:[]),
     {label:"Kapat",pri:true,run:c=>c()}]);
  $$("[data-geri]",o).forEach(b=>b.onclick=()=>{ const e=restoreTrash(b.dataset.geri);
    o.remove(); tekrar(); toast(e?`${COP_AD[e.type]||"Kayıt"} geri alındı`:"Bulunamadı"); trashScreen(sonra); });
  $$("[data-sil]",o).forEach(b=>b.onclick=()=>{
    if(!confirm("Bu kayıt kalıcı silinsin mi? Geri alınamaz.")) return;
    dropTrash(b.dataset.sil); o.remove(); tekrar(); trashScreen(sonra); });
}

/* --------- çizim tahtası (MatePad kalemi destekli) ---------
   Kağıt gibi davranır: beyaz zemin, koyu mürekkep — böylece iki temada da okunur
   ve PNG olarak nota gömülünce dışarıda da doğru görünür.
   Kalemle çizilirse çizgi kalınlığı basınca göre değişir. */
function drawPad(opts={}){
  return new Promise(async res=>{
    const RENK=["#16181d","#e34948","#2a78d6","#1baf7a"];
    /* Odaktaki yazı alanını bırak: cihazın kalem-el-yazısı katmanı odaklı bir
       metin alanı varken devreye girip kalemi kapabiliyor. */
    try{ document.activeElement?.blur?.(); }catch(_){}

    /* Arka plan görseli varsa tuval ONUN ölçüsünde olur — çözünürlük kaybolmasın.
       Ekrana sığdırmayı CSS yapar, pos() oranı uygular. */
    let bg=null, bgUrl="";
    if(opts.bgBlob){
      bgUrl=URL.createObjectURL(opts.bgBlob);
      bg=await new Promise(r=>{ const i=new Image(); i.onload=()=>r(i); i.onerror=()=>r(null); i.src=bgUrl; });
    }
    const kaydetMetni=opts.kaydetMetni||(bg?"✓ Kaydet":"✓ Nota ekle");

    const o=el("div","ovl onDark",`
      <div class="row" style="gap:6px;flex-wrap:wrap;align-items:center;flex:0 0 auto;
        width:100%;max-width:1400px">
        <button class="btn" data-a="kapat">✕ Kapat</button>
        <span style="width:1px;height:22px;background:var(--border-2);margin:0 2px"></span>
        ${RENK.map((c,i)=>`<button class="btn sm" data-c="${i}" title="Renk"
          style="width:36px;height:30px;background:${c}"></button>`).join("")}
        <button class="btn sm" data-a="silgi" title="Silgi">🧽</button>
        <button class="btn sm" data-a="yazi" title="Yazı ekle — sonra tuvale dokun">T</button>
        <button class="btn sm" data-a="geri" title="Geri al">↶</button>
        <button class="btn sm danger" data-a="temizle">Temizle</button>
        <span class="grow"></span>
        <button class="btn pri" data-a="ekle">${kaydetMetni}</button>
      </div>
      <div data-a="tuval" style="flex:1 1 auto;min-height:0;width:100%;display:flex;
        align-items:center;justify-content:center">
        <canvas style="background:#fff;border-radius:12px;touch-action:none;
          max-width:100%;max-height:100%;box-shadow:0 20px 50px rgba(0,0,0,.5)"></canvas>
      </div>
      <div class="sub" data-a="ipuc" style="flex:0 0 auto;font-size:11.5px;text-align:center">
        Kalemle ya da parmakla çiz. Kalem yazıya çevriliyorsa cihazın kalem el yazısı ayarını kapat.
      </div>`);
    o.style.cssText="position:fixed;inset:0;height:100dvh;z-index:9998;background:rgba(0,0,0,.86);"+
      "display:flex;flex-direction:column;align-items:center;gap:9px;padding:10px;"+
      "touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none";
    document.body.appendChild(o);
    /* Alttaki her şeyi etkisizleştir: odak ve cihazın kalem-el-yazısı hedefi
       arkadaki metin alanlarında kalmasın. */
    const etkisiz=[...document.body.children].filter(x=>x!==o);
    etkisiz.forEach(x=>{ try{ x.inert=true; }catch(_){} });

    const cv=$("canvas",o), ctx=cv.getContext("2d");
    const gh=(window.visualViewport&&window.visualViewport.height)||innerHeight;
    const W=bg?bg.naturalWidth :Math.round(Math.max(320,Math.min(1400,innerWidth-40)));
    const H=bg?bg.naturalHeight:Math.round(Math.max(240,Math.min(1200,gh-150)));
    const dpr=bg?1:Math.min(2,window.devicePixelRatio||1);   /* görselde kendi pikselleri yeter */
    cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
    cv.style.width=W+"px"; cv.style.height=H+"px";
    ctx.scale(dpr,dpr);
    /* fırça kalınlığı tuval boyuyla ölçeklenir: 1100 px'lik bir fotoğrafta 2 px çizgi görünmez */
    const olcek=Math.max(.8,Math.min(2.5,Math.max(W,H)/900));
    const YAZI_BOY=Math.max(20,Math.round(Math.min(W,H)/16));

    /* Çizgiler ayrı bir saydam katmanda durur. Böylece silgi arka plandaki
       görseli ORTAYA ÇIKARIR (beyaza boyamak yerine) ve geri al kolayca çalışır. */
    const lay=el("canvas"); lay.width=cv.width; lay.height=cv.height;
    const lx=lay.getContext("2d"); lx.scale(dpr,dpr); lx.lineCap="round"; lx.lineJoin="round";

    let renk=RENK[0], arac="kalem", ciz=null, raf=0;
    const strokes=[];
    const orta=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});
    const kalinlik=(st,b)=>(st.silgi?18:2.2)*olcek*(0.45+1.55*b.pr);
    const hazirla=st=>{ lx.globalCompositeOperation=st.silgi?"destination-out":"source-over";
      lx.strokeStyle=st.silgi?"#000":st.renk; };
    /* Noktaları orta noktalardan geçen bir eğriyle bağla — çizgi akıcı olur. */
    const seg=(st,i)=>{
      const p=st.p, a=p[i-1], b=p[i];
      hazirla(st); lx.lineWidth=kalinlik(st,b);
      lx.beginPath();
      if(i>=2){ const m1=orta(p[i-2],a), m2=orta(a,b);
        lx.moveTo(m1.x,m1.y); lx.quadraticCurveTo(a.x,a.y,m2.x,m2.y); }
      else { lx.moveTo(a.x,a.y); lx.lineTo(b.x,b.y); }
      lx.stroke();
    };
    /* eğri orta noktalarda bittiği için son parçayı ayrıca kapat */
    const kuyruk=st=>{ const p=st.p; if(!p||p.length<3) return;
      const a=p[p.length-2], b=p[p.length-1];
      hazirla(st); lx.lineWidth=kalinlik(st,b);
      lx.beginPath(); lx.moveTo(orta(a,b).x,orta(a,b).y); lx.lineTo(b.x,b.y); lx.stroke(); };
    const cizYazi=st=>{
      lx.globalCompositeOperation="source-over";
      lx.fillStyle=st.renk; lx.textBaseline="top";
      lx.font=`600 ${st.boy}px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif`;
      String(st.txt).split("\n").forEach((satir,i)=>lx.fillText(satir,st.x,st.y+i*st.boy*1.25));
    };
    /* katmanı arka planla birleştirip ekrana bas */
    const birlestir=()=>{
      ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height);
      ctx.restore();
      if(bg) ctx.drawImage(bg,0,0,W,H); else { ctx.fillStyle="#fff"; ctx.fillRect(0,0,W,H); }
      ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.drawImage(lay,0,0); ctx.restore();
    };
    const istek=()=>{ if(!raf) raf=requestAnimationFrame(()=>{ raf=0; birlestir(); }); };
    const paint=()=>{
      lx.save(); lx.setTransform(1,0,0,1,0,0); lx.clearRect(0,0,lay.width,lay.height); lx.restore();
      for(const st of strokes){
        if(st.tip==="yazi"){ cizYazi(st); continue; }
        for(let i=1;i<st.p.length;i++) seg(st,i);
        kuyruk(st);
      }
      birlestir();
    };
    paint();

    /* Android Chrome arka plana atılan sekmenin tuval içeriğini atabiliyor —
       cihazın kalem el yazısı katmanı sayfayı arka plana aldığında da olur.
       Çizgiler bellekte durduğu için geri dönüldüğünde hepsi yeniden çizilir. */
    const tazele=()=>{ try{ paint(); }catch(_){} };
    document.addEventListener("visibilitychange",tazele);
    window.addEventListener("pageshow",tazele);
    window.addEventListener("focus",tazele);
    window.addEventListener("resize",tazele);
    cv.addEventListener("contextlost",e=>e.preventDefault());
    cv.addEventListener("contextrestored",tazele);

    /* ekranda gösterilen boy mantıksal boydan farklı olabilir (döndürme, dar ekran) */
    const pos=e=>{ const r=cv.getBoundingClientRect();
      const sx=W/(r.width||W), sy=H/(r.height||H);
      return { x:(e.clientX-r.left)*sx, y:(e.clientY-r.top)*sy,
        /* basınç yalnızca kalemde anlamlı; dokunuş ve fare sabit kalınlık verir */
        pr: (e.pointerType==="pen"&&e.pressure>0) ? e.pressure : 0.5 }; };
    cv.addEventListener("pointerdown",e=>{
      e.preventDefault();
      const q=pos(e);
      if(arac==="yazi"){
        const txt=prompt("Görsele eklenecek yazı:");
        if(txt&&txt.trim()){
          strokes.push({tip:"yazi",txt:txt.trim(),x:q.x,y:q.y,renk,boy:YAZI_BOY});
          paint();
        }
        aracSec("kalem");     /* tek seferlik: yazı bırakınca kaleme dön */
        return;
      }
      try{ cv.setPointerCapture(e.pointerId); }catch(_){}
      ciz={renk,silgi:arac==="silgi",p:[q,{...q}]};   /* aynı nokta iki kez: tek dokunuş nokta bırakır */
      strokes.push(ciz); seg(ciz,1); istek(); });
    cv.addEventListener("pointermove",e=>{ if(!ciz) return; e.preventDefault();
      /* iki kare arasında yakalanan ara noktaları da al — kalemde belirgin fark yapıyor */
      const hepsi=e.getCoalescedEvents?e.getCoalescedEvents():null;
      for(const ev of (hepsi&&hepsi.length?hepsi:[e])){ ciz.p.push(pos(ev)); seg(ciz,ciz.p.length-1); }
      istek(); });
    /* pointercancel: cihaz kalemi kapmış olabilir — o ana kadarki çizgi korunur */
    const bitir=()=>{ if(ciz){ kuyruk(ciz); birlestir(); } ciz=null; };
    cv.addEventListener("pointerup",bitir);
    cv.addEventListener("pointercancel",bitir);

    const A=a=>$(`[data-a="${a}"]`,o);
    function aracSec(yeni,renkIdx){
      arac=yeni;
      if(renkIdx!=null) renk=RENK[renkIdx];
      $$("[data-c]",o).forEach((b,j)=>b.style.outline=(arac==="silgi"||j!==RENK.indexOf(renk))?"none":"2px solid var(--accent)");
      A("silgi").classList.toggle("pri",arac==="silgi");
      A("yazi").classList.toggle("pri",arac==="yazi");
      A("ipuc").textContent = arac==="yazi"
        ? "Yazıyı bırakmak istediğin yere dokun."
        : "Kalemle ya da parmakla çiz. Kalem yazıya çevriliyorsa cihazın kalem el yazısı ayarını kapat.";
    }
    $$("[data-c]",o).forEach((b,i)=>b.onclick=()=>aracSec("kalem",i));
    aracSec("kalem",0);
    A("silgi").onclick=()=>aracSec(arac==="silgi"?"kalem":"silgi");
    A("yazi").onclick=()=>aracSec(arac==="yazi"?"kalem":"yazi");
    A("geri").onclick=()=>{ strokes.pop(); paint(); };
    A("temizle").onclick=()=>{ if(strokes.length&&!confirm(bg?"Eklediğin çizim ve yazılar silinsin mi? (Görselin kendisi kalır)":"Tüm çizim silinsin mi?")) return;
      strokes.length=0; paint(); };

    /* --- kapanış: ✕ Kapat, Escape, cihazın geri tuşu. Karartıya dokunmak KAPATMAZ;
       çizerken avuç değince kapanmasın ve kapanış yeri belirsiz kalmasın. --- */
    let gecmis=false;
    try{ history.pushState({studyosDraw:1},""); gecmis=true; }catch(_){}
    const onPop=()=>{ gecmis=false; vazgec(true); };
    const onKey=e=>{ if(e.key==="Escape"){ e.preventDefault(); vazgec(false); } };
    window.addEventListener("popstate",onPop);
    document.addEventListener("keydown",onKey);
    const kapat=v=>{
      document.removeEventListener("keydown",onKey);
      window.removeEventListener("popstate",onPop);
      document.removeEventListener("visibilitychange",tazele);
      window.removeEventListener("pageshow",tazele);
      window.removeEventListener("focus",tazele);
      window.removeEventListener("resize",tazele);
      etkisiz.forEach(x=>{ try{ x.inert=false; }catch(_){} });
      if(bgUrl) URL.revokeObjectURL(bgUrl);
      o.remove();
      if(gecmis){ gecmis=false; try{ history.back(); }catch(_){} }
      res(v);
    };
    function vazgec(geriTusundan){
      if(strokes.length&&!confirm("Kaydedilmeden kapatılsın mı?")){
        /* geri tuşuyla gelindiyse yığındaki kaydı geri koy, bir sonraki geri de çalışsın */
        if(geriTusundan){ try{ history.pushState({studyosDraw:1},""); gecmis=true; }catch(_){} }
        return;
      }
      kapat(null);
    }
    A("kapat").onclick=()=>vazgec(false);
    A("ekle").onclick=()=>{ if(!strokes.length){ toast(bg?"Değişiklik yok":"Çizim boş"); return; }
      cv.toBlob(b=>kapat(b),"image/png"); };
  });
}

/* --------- görsel büyüteci + döndürme ---------
   Not önizlemesinde bir görsele dokununca açılır. Nottaki görseller bugüne kadar
   tıklanamıyordu; düğme eklemek yerine büyütme ve döndürme buraya kondu.
   Döndürme önce ekranda önizlenir, "Kaydet" tek seferde yazar — her dokunuşta
   yeniden kodlamak JPEG'i adım adım bozardı. */
async function imageViewer(ref){
  const url=await mediaURL(ref);
  if(!url){ toast("⚠️ Görsel bulunamadı"); return; }
  let aci=0;
  const o=el("div","ovl onDark",`
    <div class="row" style="gap:6px;flex-wrap:wrap;align-items:center;flex:0 0 auto;
      width:100%;max-width:1000px">
      <button class="btn" data-a="kapat">✕ Kapat</button>
      <span class="grow"></span>
      <button class="btn sm" data-a="ciz" title="Görselin üzerine çiz ya da yazı ekle">✏️ Üzerine çiz</button>
      <button class="btn sm" data-a="sol">↺ 90° sola</button>
      <button class="btn sm" data-a="sag">↻ 90° sağa</button>
      <button class="btn pri" data-a="kaydet" disabled>✓ Kaydet</button>
    </div>
    <div style="flex:1 1 auto;min-height:0;width:100%;display:flex;
      align-items:center;justify-content:center">
      <img class="rotimg" src="${url}" alt="">
    </div>`);
  o.style.cssText="position:fixed;inset:0;height:100dvh;z-index:9998;background:rgba(0,0,0,.9);"+
    "display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px;"+
    "touch-action:none;user-select:none;-webkit-user-select:none";
  document.body.appendChild(o);
  const etkisiz=[...document.body.children].filter(x=>x!==o);
  etkisiz.forEach(x=>{ try{ x.inert=true; }catch(_){} });

  const im=$("img",o), A=a=>$(`[data-a="${a}"]`,o);
  const ciz=()=>{ im.style.transform=`rotate(${aci}deg)`; A("kaydet").disabled=(aci%360===0); };
  A("sol").onclick=()=>{ aci-=90; ciz(); };
  A("sag").onclick=()=>{ aci+=90; ciz(); };

  let gecmis=false;
  try{ history.pushState({studyosImg:1},""); gecmis=true; }catch(_){}
  const onPop=()=>{ gecmis=false; kapat(); };
  const onKey=e=>{ if(e.key==="Escape"){ e.preventDefault(); vazgec(); } };
  window.addEventListener("popstate",onPop);
  document.addEventListener("keydown",onKey);
  function kapat(){
    document.removeEventListener("keydown",onKey);
    window.removeEventListener("popstate",onPop);
    etkisiz.forEach(x=>{ try{ x.inert=false; }catch(_){} });
    o.remove();
    if(gecmis){ gecmis=false; try{ history.back(); }catch(_){} }
  }
  function vazgec(){
    if(aci%360!==0&&!confirm("Döndürme kaydedilmeden kapatılsın mı?")) return;
    kapat();
  }
  A("ciz").onclick=async()=>{
    if(aci%360!==0&&!confirm("Kaydedilmemiş döndürme kaybolacak. Çizime geçilsin mi?")) return;
    const id=ref.startsWith("idb:")?ref.slice(4):null;
    const blob=id?await idbGet(id):null;
    if(!blob){ toast("⚠️ Görsel bulunamadı"); return; }
    kapat();
    const yeni=await drawPad({bgBlob:blob});
    if(!yeni) return;
    await idbPut(id,yeni);
    /* önbellekteki eski objectURL bırakılmazsa çizimsiz hali çizilmeye devam eder */
    const eskiUrl=MEDIA_URL.get(id); if(eskiUrl) URL.revokeObjectURL(eskiUrl);
    MEDIA_URL.delete(id);
    idbUsage(); refreshAll(); toast("✏️ Çizim görsele işlendi");
  };
  A("kapat").onclick=vazgec;
  A("kaydet").onclick=async()=>{
    A("kaydet").disabled=true;
    const ok=await rotateMedia(ref,((aci%360)+360)%360);
    kapat();
    if(ok){ toast("🔄 Görsel döndürüldü"); refreshAll(); }
    else toast("⚠️ Görsel döndürülemedi");
  };
}
/* Görseli IndexedDB'de AYNI id altında döndürülmüş haliyle değiştirir; referans
   değişmediği için not metnine, karta ya da sözlüğe dokunmak gerekmiyor. */
function rotateMedia(ref,deg){
  return new Promise(async res=>{
    try{
      if(!ref||!ref.startsWith("idb:")||!deg) return res(false);
      const id=ref.slice(4), blob=await idbGet(id);
      if(!blob) return res(false);
      const src=URL.createObjectURL(blob), img=new Image();
      img.onload=()=>{
        const yan=deg%180!==0, c=el("canvas");
        c.width = yan?img.naturalHeight:img.naturalWidth;
        c.height= yan?img.naturalWidth :img.naturalHeight;
        const x=c.getContext("2d");
        x.translate(c.width/2,c.height/2); x.rotate(deg*Math.PI/180);
        x.drawImage(img,-img.naturalWidth/2,-img.naturalHeight/2);
        const tur=(blob.type==="image/png"||blob.type==="image/webp")?blob.type:"image/jpeg";
        c.toBlob(async nb=>{
          URL.revokeObjectURL(src);
          if(!nb) return res(false);
          try{
            await idbPut(id,nb);
            /* önbellekteki eski objectURL bırakılmazsa döndürülmemiş hali çizilir */
            const eski=MEDIA_URL.get(id); if(eski) URL.revokeObjectURL(eski);
            MEDIA_URL.delete(id);
            idbUsage();
            res(true);
          }catch(e){ res(false); }
        },tur,.92);
      };
      img.onerror=()=>{ URL.revokeObjectURL(src); res(false); };
      img.src=src;
    }catch(e){ res(false); }
  });
}

/* --------- dosya / görsel --------- */
function pickFile(accept){ return new Promise(res=>{ const i=el("input"); i.type="file"; if(accept)i.accept=accept;
  i.onchange=()=>res(i.files[0]||null); i.click(); }); }
function fileToDataURL(f){ return new Promise((res,rej)=>{ const r=new FileReader();
  r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(f); }); }
/* görselleri küçültüp sıkıştır — localStorage ~5MB, orijinal foto sığmaz */
function imageScaled(file,max=1100,q=.82){
  return new Promise(async(res,rej)=>{
    try{
      const url=await fileToDataURL(file);
      if(file.type==="image/gif"||file.type==="image/svg+xml") return res(url);
      const img=new Image();
      img.onload=()=>{ const sc=Math.min(1,max/Math.max(img.width,img.height));
        const c=el("canvas"); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        res(c.toDataURL("image/jpeg",q)); };
      img.onerror=()=>res(url); img.src=url;
    }catch(e){ rej(e); }
  });
}
const bytesFmt=n=>n>1048576?(n/1048576).toFixed(1)+" MB":n>1024?Math.round(n/1024)+" KB":n+" B";
function storageUsed(){ try{ return new Blob([JSON.stringify(DB)]).size; }catch(e){ return JSON.stringify(DB).length; } }

/* --------- markdown (mini) --------- */
function md(src){
  let s=esc(src);
  s=s.replace(/```([\s\S]*?)```/g,(m,c)=>`<pre><code>${c.trim()}</code></pre>`);
  s=s.replace(/^### (.*)$/gm,"<h3>$1</h3>").replace(/^## (.*)$/gm,"<h2>$1</h2>").replace(/^# (.*)$/gm,"<h1>$1</h1>");
  s=s.replace(/^&gt; (.*)$/gm,"<blockquote>$1</blockquote>");
  s=s.replace(/^---$/gm,"<hr>");
  s=s.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/(^|\W)\*([^*\n]+)\*/g,"$1<i>$2</i>");
  s=s.replace(/==([^=]+)==/g,"<mark>$1</mark>");
  s=s.replace(/\[\[([^\]\n]+)\]\]/g,(m,raw)=>{
    const p=wlParse(raw), hit=wlFind(p);
    return `<a class="wl${hit?"":" new"}" data-wl="${raw}">${WL_ICON[p.t]} ${p.q}</a>`;});
  s=s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g,(m,a,u)=>
    u.startsWith("idb:")?`<img data-media="${u}" alt="${a}">`
    :/^(data:image|https?:)/.test(u)?`<img src="${u}" alt="${a}">`:m);
  s=s.replace(/`([^`\n]+)`/g,"<code>$1</code>");
  s=s.replace(/^\s*[-*] (.*)$/gm,"<li>$1</li>").replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g,"<ul>$1</ul>");
  s=s.replace(/(^|[^("'=\w])(https?:\/\/[^\s<]+)/g,(m,pre,u)=>{
    const [ic,host]=linkBadge(u); return `${pre}<a class="lnk" href="${u}" target="_blank" rel="noopener">${ic} ${host||"bağlantı"}</a>`;});
  s=s.replace(/\n{2,}/g,"<br><br>").replace(/\n/g,"<br>");
  s=s.replace(/<br>(<\/?(h1|h2|h3|ul|li|pre|blockquote|hr))/g,"$1");
  return s;
}

const WINS=new Map(); let ztop=100;
function openApp(appId,opts={}){
  const app=APPS[appId]; if(!app) return;
  if(app.single){ for(const w of WINS.values()) if(w.appId===appId){ focusWin(w); if(w.node.classList.contains("min")) w.node.classList.remove("min"); return w; } }
  const id=uid();
  const node=el("div","win");
  const n=WINS.size;
  const W=Math.min(opts.w||app.w||760, window.innerWidth-40);
  const H=Math.min(opts.h||app.h||520, window.innerHeight-110);
  node.style.width=W+"px"; node.style.height=H+"px";
  node.style.left=Math.max(10,Math.min((window.innerWidth-W)/2 + (n%5)*26 - 52, window.innerWidth-W-10))+"px";
  node.style.top=Math.max(6,Math.min(40+(n%5)*24, window.innerHeight-H-70))+"px";
  node.innerHTML=`<div class="titlebar">
      <div class="lights"><span class="light c" title="Kapat">✕</span><span class="light m" title="Küçült">–</span><span class="light z" title="Büyüt">+</span></div>
      <div class="wtitle">${esc(app.icon+"  "+app.name)}</div></div>
    <div class="wbody"></div><div class="resize"></div>`;
  $("#desktop").appendChild(node);
  const w={id,appId,node,body:$(".wbody",node),state:opts.state||{}};
  WINS.set(id,w);
  $(".light.c",node).onclick=()=>closeWin(w);
  $(".light.m",node).onclick=()=>{node.classList.add("min");syncDock();};
  $(".light.z",node).onclick=()=>toggleMax(w);
  $(".titlebar",node).ondblclick=e=>{if(!e.target.classList.contains("light"))toggleMax(w);};
  dragify(w); resizify(w);
  node.addEventListener("mousedown",()=>focusWin(w),true);
  focusWin(w);
  app.render(w);
  syncDock();
  return w;
}
function closeWin(w){ APPS[w.appId].onClose?.(w); w.node.remove(); WINS.delete(w.id); syncDock();
  const last=[...WINS.values()].pop(); if(last) focusWin(last); else $("#mbApp").textContent="Masaüstü"; }
function focusWin(w){ if(w.node.style.zIndex==ztop) {} ztop++; w.node.style.zIndex=ztop;
  $$(".win").forEach(n=>n.classList.remove("focus")); w.node.classList.add("focus");
  $("#mbApp").textContent=APPS[w.appId].name; }
function toggleMax(w){
  const n=w.node;
  if(n.classList.contains("max")||n._snapped){        /* yaslanmış pencere de eski boyuna döner */
    n.classList.remove("max","snapped"); n._snapped=null; Object.assign(n.style,n._prev||{});
  } else {
    n._prev={left:n.style.left,top:n.style.top,width:n.style.width,height:n.style.height};
    n.classList.add("max"); Object.assign(n.style,{left:"0px",top:"0px",width:"100%",height:"calc(100% - 62px)"});
  }
  APPS[w.appId].onResize?.(w);
}
/* --------- pencere yaslama: başlık çubuğunu kenara sürükle ---------
   Tablette not + PDF'i yan yana koymak elle boyutlandırmayla zahmetliydi.
   Köşede yan yaslama kazanır (max değil) — asıl istenen yarım ekran. */
const YASLA_KENAR=30;
const YASLA_KUTU={
  sol:{left:"0px",top:"0px",width:"50%",height:"calc(100% - 62px)"},
  sag:{left:"50%",top:"0px",width:"50%",height:"calc(100% - 62px)"},
  max:{left:"0px",top:"0px",width:"100%",height:"calc(100% - 62px)"},
};
const YASLA_AD={sol:"◧ Sol yarı",sag:"◨ Sağ yarı",max:"⬜ Tam ekran"};
function snapZone(ev,d){
  if(ev.clientX-d.left<YASLA_KENAR) return "sol";
  if(d.right-ev.clientX<YASLA_KENAR) return "sag";
  if(ev.clientY-d.top<YASLA_KENAR) return "max";
  return null;
}
function snapGhost(zone){
  let g=$("#snapghost");
  if(!zone){ g?.remove(); return; }
  if(!g){ g=el("div",null,"<b></b>"); g.id="snapghost"; $("#desktop").appendChild(g); }
  Object.assign(g.style,YASLA_KUTU[zone]);
  $("b",g).textContent=YASLA_AD[zone];
}
function applySnap(w,zone){
  const n=w.node;
  if(!n._snapped) n._prev={left:n.style.left,top:n.style.top,width:n.style.width,height:n.style.height};
  n._snapped=zone;
  n.classList.toggle("max",zone==="max");
  n.classList.add("snapped");
  Object.assign(n.style,YASLA_KUTU[zone]);
  APPS[w.appId].onResize?.(w);
}
function dragify(w){
  const bar=$(".titlebar",w.node);
  bar.addEventListener("pointerdown",e=>{
    if(e.target.classList.contains("light")) return;
    if(w.node.classList.contains("max")) return;
    e.preventDefault();
    focusWin(w);
    const d=$("#desktop").getBoundingClientRect(), r=w.node.getBoundingClientRect();
    const ox=e.clientX-r.left, oy=e.clientY-r.top;
    let nx=r.left-d.left, ny=r.top-d.top, raf=0, zone=null;
    w.node.classList.add("dragging");
    try{ bar.setPointerCapture(e.pointerId); }catch(_){}
    const paint=()=>{ raf=0; w.node.style.left=nx+"px"; w.node.style.top=ny+"px"; };
    const move=ev=>{
      if(ev.pointerId!==e.pointerId) return;
      ev.preventDefault();
      nx=Math.max(-r.width+90, Math.min(ev.clientX-ox-d.left, d.width-90));
      ny=Math.max(0,          Math.min(ev.clientY-oy-d.top,  d.height-38));
      const z=snapZone(ev,d); if(z!==zone){ zone=z; snapGhost(zone); }
      if(!raf) raf=requestAnimationFrame(paint);
    };
    const up=()=>{
      if(raf){ cancelAnimationFrame(raf); paint(); }
      w.node.classList.remove("dragging");
      snapGhost(null);
      if(zone) applySnap(w,zone);
      else if(w.node._snapped){ w.node._snapped=null; w.node.classList.remove("snapped"); }
      bar.removeEventListener("pointermove",move);
      bar.removeEventListener("pointerup",up);
      bar.removeEventListener("pointercancel",up);
      bar.removeEventListener("lostpointercapture",up);
      try{ bar.releasePointerCapture(e.pointerId); }catch(_){}
    };
    bar.addEventListener("pointermove",move);
    bar.addEventListener("pointerup",up);
    bar.addEventListener("pointercancel",up);
    bar.addEventListener("lostpointercapture",up);
  });
}
function resizify(w){
  const h=$(".resize",w.node);
  h.addEventListener("pointerdown",e=>{
    e.preventDefault(); e.stopPropagation(); focusWin(w);
    const r=w.node.getBoundingClientRect(), sx=e.clientX, sy=e.clientY;
    let nw=r.width, nh=r.height, raf=0;
    w.node.classList.add("dragging");
    try{ h.setPointerCapture(e.pointerId); }catch(_){}
    const paint=()=>{ raf=0; w.node.style.width=nw+"px"; w.node.style.height=nh+"px"; };
    const move=ev=>{
      if(ev.pointerId!==e.pointerId) return;
      ev.preventDefault();
      nw=Math.max(300, r.width+ev.clientX-sx);
      nh=Math.max(200, r.height+ev.clientY-sy);
      if(!raf) raf=requestAnimationFrame(paint);
    };
    const up=()=>{
      if(raf){ cancelAnimationFrame(raf); paint(); }
      w.node.classList.remove("dragging");
      h.removeEventListener("pointermove",move); h.removeEventListener("pointerup",up);
      h.removeEventListener("pointercancel",up); h.removeEventListener("lostpointercapture",up);
      try{ h.releasePointerCapture(e.pointerId); }catch(_){}
      APPS[w.appId].onResize?.(w);
    };
    h.addEventListener("pointermove",move); h.addEventListener("pointerup",up);
    h.addEventListener("pointercancel",up); h.addEventListener("lostpointercapture",up);
  });
}

/* {{c1::...}} boşluk doldurma. Bir satırda birden çok numara varsa her numara
   için ayrı kart çıkar; o kartta yalnızca kendi boşluğu gizlenir, diğerleri açık kalır. */
const CLOZE_RX=/\{\{c(\d+)::([\s\S]*?)\}\}/g;
const hasCloze=l=>/\{\{c\d+::/.test(l);
function clozeCards(line){
  const nums=[...new Set([...line.matchAll(CLOZE_RX)].map(m=>+m[1]))].sort((a,b)=>a-b);
  if(!nums.length) return [];
  const acik=line.replace(CLOZE_RX,(m,i,t)=>t).trim();
  return nums.map(no=>({
    front: line.replace(CLOZE_RX,(m,i,t)=>+i===no?"[…]":t).trim(),
    back: acik
  })).filter(c=>c.front&&c.back&&c.front!==c.back);
}
/* not gövdesinden kart çifti çıkar: "Soru :: Cevap" satırları ve {{c1::…}} boşlukları */
function noteCardPairs(body){
  const out=[];
  for(const raw of String(body||"").split("\n")){
    const l=raw.trim().replace(/^[-*]\s+/,"");
    if(!l) continue;
    if(hasCloze(l)){ out.push(...clozeCards(l)); continue; }   /* cloze içinde :: var, önce o bakılır */
    const i=l.indexOf("::"); if(i<0) continue;
    const f=l.slice(0,i).trim(), b=l.slice(i+2).trim();
    if(f&&b) out.push({front:f,back:b});
  }
  return out;
}
function noteToCards(n){
  const pairs=noteCardPairs(n.body);
  if(!pairs.length){ toast('Bu notta "Soru :: Cevap" ya da {{c1::…}} satırı yok'); return; }
  const name="Not: "+(n.title||"Adsız");
  let dk=DB.decks.find(d=>d.name===name);
  if(!dk){ dk={id:uid(),name,courseId:n.courseId}; DB.decks.push(dk); }
  let add=0;
  pairs.forEach(({front,back})=>{ if(DB.cards.some(c=>c.deckId===dk.id&&c.front===front)) return;
    DB.cards.push({id:uid(),deckId:dk.id,front,back,ef:2.5,int:0,reps:0,lapses:0,due:today()}); add++; });
  save(); rerender("cards"); updateMenubar();
  toast(add?`${add} yeni kart → "${name}"`:"Tüm satırlar zaten kartta");
}

/* ---------------- Kartlar (aralıklı tekrar / SM-2) ---------------- */
/* Yeni kart = hiç değerlendirilmemiş. sm2() her değerlendirmede "seen" yazar,
   bu yüzden bilinemeyen bir kart da ikinci kez "yeni" sayılmaz. */
const isNewCard=c=>!c.seen;
const NEW_PER_DAY=20;
function newLimit(){ const v=DB.settings.newPerDay; return v==null?NEW_PER_DAY:Math.max(0,v); }
function newSeenToday(){ const v=DB.settings.newSeen; return v&&v.date===today()?(v.n||0):0; }
function markNewSeen(){ DB.settings.newSeen={date:today(),n:newSeenToday()+1}; }
function newQuota(){ return Math.max(0,newLimit()-newSeenToday()); }
/* Bekleyen yeni kartlar — kuyruğa alınmayanlar dahil (arayüzde "sınıra ulaşıldı" der) */
function newWaiting(deckId){ const t=today();
  return DB.cards.filter(c=>(!deckId||c.deckId===deckId)&&isNewCard(c)&&(!c.due||c.due<=t)).length; }
/* Vadesi gelen kartlar. Günlük yeni kart kotası GLOBAL harcanır ve DB.cards
   sırası sabit olduğu için deste deste çağrıldığında da aynı kartlar seçilir. */
function dueCards(deckId){
  const t=today(); let kota=newQuota(); const out=[];
  for(const c of DB.cards){
    if(c.due&&c.due>t) continue;
    if(isNewCard(c)){ if(kota<=0) continue; kota--; }
    out.push(c);
  }
  return deckId?out.filter(c=>c.deckId===deckId):out;
}
/* Fisher-Yates. Tur kuyruğu her başlayışta karışır: hep aynı sırayla görünce
   cevap içerikten değil sıradan hatırlanmaya başlıyor. */
function shuffled(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function sm2(card,q){
  if(q<3){ card.reps=0; card.int=1; card.lapses=(card.lapses||0)+1; }
  else{ card.reps=(card.reps||0)+1;
    card.int = card.reps===1?1 : card.reps===2?6 : Math.round((card.int||1)*(card.ef||2.5));
    card.ef = Math.max(1.3,(card.ef||2.5)+(0.1-(5-q)*(0.08+(5-q)*0.02))); }
  card.due=addDays(today(),card.int);
  card.seen=today();
}

/* ---------------- Pomodoro ---------------- */
const Pomo={
  left:0, total:0, running:false, mode:"focus", courseId:null, topicId:null, label:"", tick:null,
  start(courseId,label,topicId){ this.courseId=courseId||DB.courses[0]?.id;
    this.label=label||""; this.topicId=topicId||null;
    this.mode="focus"; this.total=DB.settings.pomo*60; this.left=this.total; this.run(); },
  startBreak(){ this.mode="break"; this.total=DB.settings.brk*60; this.left=this.total; this.run(); },
  run(){ this.running=true; clearInterval(this.tick);
    this.tick=setInterval(()=>{ this.left--; if(this.left<=0) this.finish(); this.paint(); },1000); this.paint(); },
  pause(){ this.running=false; clearInterval(this.tick); this.paint(); },
  reset(){ this.pause(); this.left=this.total=(this.mode==="focus"?DB.settings.pomo:DB.settings.brk)*60; this.paint(); },
  finish(){ clearInterval(this.tick); this.running=false;
    if(this.mode==="focus"){ const min=Math.round(this.total/60);
      /* konu da yazılır: yoksa pomodoro süresi "Konulara göre" istatistiğine ve günlük
         plandaki "bu konuya dokunuldu mu" hesabına hiç girmiyordu */
      DB.sessions.push({id:uid(),courseId:this.courseId,topicId:this.topicId||null,
        date:today(),min,kind:"focus",label:this.label||topicName(this.topicId)});
      save(); toast(`✅ ${min} dakika kaydedildi — mola zamanı`); beep(); this.startBreak(); }
    else { toast("☕ Mola bitti, hadi devam!"); beep(); this.mode="focus"; this.left=this.total=DB.settings.pomo*60; }
    updateMenubar(); rerender("stats"); },
  paint(){ rerender("pomodoro"); paintFocus(); }
};
function beep(){ try{ const a=new (window.AudioContext||window.webkitAudioContext)();
  const o=a.createOscillator(), g=a.createGain(); o.connect(g); g.connect(a.destination);
  o.frequency.value=660; g.gain.setValueAtTime(.0001,a.currentTime);
  g.gain.exponentialRampToValueAtTime(.25,a.currentTime+.03);
  g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+1.1);
  o.start(); o.stop(a.currentTime+1.15);}catch(e){} }
const mmss=s=>`${pad(Math.floor(Math.max(0,s)/60))}:${pad(Math.max(0,s)%60)}`;
APPS.pomodoro={ name:"Pomodoro", icon:"⏱", w:420, h:520, desk:true, single:true,
  render(w){
    const p=Pomo.total?1-Pomo.left/Pomo.total:0;

    w.body.innerHTML=`<div class="app">

        <select class="inp" data-a="t" style="width:150px"><option value="">— konu seçme —</option>
          ${topicOptions(Pomo.courseId).map(t=>`<option value="${t.id}" ${Pomo.topicId===t.id?"selected":""}>${esc(t.label)}</option>`).join("")}</select></div>
      <div class="grow" style="display:grid;place-items:center;gap:18px;padding:18px">
        <div class="ring" style="--p:${(p*100).toFixed(1)}">
          <div style="text-align:center"><div class="timer">${mmss(Pomo.left||DB.settings.pomo*60)}</div>
          <div class="sub">${esc(Pomo.label||topicName(Pomo.topicId)||"serbest çalışma")}</div></div>
        </div>
        <div class="row">
          <button class="btn pri" data-a="tog">${Pomo.running?"⏸ Duraklat":"▶ Başlat"}</button>
          <button class="btn" data-a="rst">↺ Sıfırla</button>
          <button class="btn" data-a="focus">🌙 Odak modu</button>
        </div>
        <div class="card" style="width:100%">

          <div class="meter" style="margin-top:8px"><i style="width:${Math.min(100,todayMin/DB.settings.goal*100)}%"></i></div>
          <div class="sub" style="margin-top:8px">${DB.sessions.filter(s=>s.date===today()).length} oturum tamamlandı</div>
        </div>
        <div class="row sub"><span>Süre</span>
          <input class="inp" type="number" min="1" max="120" value="${DB.settings.pomo}" data-a="len" style="width:70px">
          <span>Mola</span>
          <input class="inp" type="number" min="1" max="60" value="${DB.settings.brk}" data-a="brk" style="width:70px">
        </div>
      </div></div>`;
    const A=a=>$(`[data-a="${a}"]`,w.body);
    A("tog").onclick=()=>{ if(Pomo.running)Pomo.pause(); else { if(!Pomo.left){Pomo.total=DB.settings.pomo*60;Pomo.left=Pomo.total;} Pomo.courseId=A("c").value; Pomo.run(); } };
    A("rst").onclick=()=>Pomo.reset();

    A("t").onchange=e=>{ Pomo.topicId=e.target.value||null; Pomo.label="";
      DB.settings.lastTopic=Pomo.topicId; save(); this.render(w); };
    A("len").onchange=e=>{DB.settings.pomo=Math.max(1,+e.target.value||25);save();if(!Pomo.running){Pomo.total=Pomo.left=DB.settings.pomo*60;}this.render(w);};
    A("brk").onchange=e=>{DB.settings.brk=Math.max(1,+e.target.value||5);save();};
  }};
</script>
