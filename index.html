    A("course").onchange=e=>{q.courseId=e.target.value;saveAnd("quiz");};   /* konu seçicileri tazelensin */
    A("add").onclick=()=>{q.questions.push({q:"",ch:["","","",""],a:0,ex:""});saveAnd("quiz");};
    $$("[data-dq]",w.body).forEach(b=>b.onclick=()=>{q.questions.splice(+b.dataset.dq,1);saveAnd("quiz");});
    $$("[data-q]",w.body).forEach(i=>i.oninput=()=>{q.questions[+i.dataset.q].q=i.value;save();});
    $$("[data-ex]",w.body).forEach(i=>i.oninput=()=>{q.questions[+i.dataset.ex].ex=i.value;save();});
    $$("[data-tp]",w.body).forEach(i=>i.onchange=()=>{q.questions[+i.dataset.tp].topicId=i.value||null;save();});
    $$("[data-c]",w.body).forEach(i=>i.oninput=()=>{const[a,b]=i.dataset.c.split(".").map(Number);q.questions[a].ch[b]=i.value;save();});
    $$("[data-a2]",w.body).forEach(i=>i.onchange=()=>{const[a,b]=i.dataset.a2.split(".").map(Number);q.questions[a].a=b;save();});
  },
  run(w){
    const s=w.state, q=DB.quizzes.find(x=>x.id===s.quiz);
    if(s.i>=q.questions.length){
      const correct=s.answers.filter((a,i)=>a===q.questions[i].a).length;
      const pct=Math.round(correct/q.questions.length*100);
      w.body.innerHTML=`<div class="app"><div class="grow scroll pad" style="text-align:center">
        <div style="font-size:46px;margin-top:18px">${pct>=70?"🎉":pct>=40?"💪":"📚"}</div>
        <div class="hero">%${pct}</div><div class="sub">${correct} / ${q.questions.length} doğru</div>
        <div class="row" style="justify-content:center;margin:18px 0;flex-wrap:wrap">
          <button class="btn" data-a="again">↺ Tekrar çöz</button>
          <button class="btn pri" data-a="tocards">Yanlışları karta çevir</button>
          <button class="btn" data-a="back">Listeye dön</button></div>
        <div style="text-align:left">${q.questions.map((x,i)=>{const ok=s.answers[i]===x.a;
          return `<div class="card" data-gloss style="margin-bottom:8px;border-left:3px solid ${ok?"var(--good)":"var(--bad)"}">
            <b>${i+1}. ${esc(x.q)}</b>
            <div class="sub" style="margin-top:4px">Senin cevabın: ${esc(x.ch[s.answers[i]]??"—")} ${ok?"✓":"✗"}</div>
            ${ok?"":`<div class="sub">Doğru: <b>${esc(x.ch[x.a])}</b></div>`}
            ${x.ex?`<div class="sub" style="margin-top:4px">💡 ${esc(x.ex)}</div>`:""}</div>`;}).join("")}</div>
      </div></div>`;
      if(!s.logged){
        /* konusu işaretli sorular için doğru/yanlış dökümü — "zayıf konular" bundan çıkar */
        const topics={};
        q.questions.forEach((x,i)=>{ if(!x.topicId) return;
          const a=topics[x.topicId]||(topics[x.topicId]=[0,0]);
          a[s.answers[i]===x.a?0:1]++; });
        DB.quizRuns.push({id:uid(),quizId:q.id,date:today(),correct,total:q.questions.length,topics});
        s.logged=true;save();}
      const A=a=>$(`[data-a="${a}"]`,w.body);
      A("again").onclick=()=>{s.i=0;s.answers=[];s.logged=false;s.locked=false;this.render(w);};
      A("back").onclick=()=>{s.mode=null;s.logged=false;this.render(w);};
      A("tocards").onclick=()=>{
        let dk=DB.decks.find(d=>d.name==="Yanlışlarım — "+q.name);
        if(!dk){dk={id:uid(),name:"Yanlışlarım — "+q.name,courseId:q.courseId};DB.decks.push(dk);}
        let n=0; q.questions.forEach((x,i)=>{ if(s.answers[i]!==x.a){ n++;
          DB.cards.push({id:uid(),deckId:dk.id,front:x.q,back:x.ch[x.a]+(x.ex?"\n\n"+x.ex:""),ef:2.5,int:0,reps:0,lapses:0,due:today()});}});
        save(); toast(n?`${n} kart "${dk.name}" destesine eklendi`:"Yanlış yok, harika!"); rerender("cards"); updateMenubar(); };
      return;
    }
    const x=q.questions[s.i], picked=s.answers[s.i];
    w.body.innerHTML=`<div class="app">
      <div class="toolbar"><button class="btn sm" data-a="back">‹ Çık</button>
        <span class="grow"></span><span class="sub">${s.i+1} / ${q.questions.length}</span></div>
      <div class="meter" style="border-radius:0;height:4px"><i style="width:${s.i/q.questions.length*100}%"></i></div>
      <div class="grow scroll pad">
        <div class="h1" style="margin-bottom:16px;line-height:1.45" data-gloss>${esc(x.q)}</div>
        <div class="col" data-gloss>${x.ch.map((c,j)=>{
          let cls="choice"; if(s.locked){ if(j===x.a)cls+=" ok"; else if(j===picked)cls+=" no"; } else if(j===picked)cls+=" pick";
          return `<div class="${cls}" data-ch="${j}"><b>${String.fromCharCode(65+j)}</b><span>${esc(c)}</span></div>`;}).join("")}</div>
        ${s.locked&&x.ex?`<div class="card" style="margin-top:12px">💡 ${esc(x.ex)}</div>`:""}
      </div>
      <div class="toolbar" style="border-top:1px solid var(--border-2);border-bottom:none">
        <span class="grow"></span>
        <button class="btn pri" data-a="next">${s.locked?(s.i===q.questions.length-1?"Sonucu gör":"Sonraki ›"):"Cevapla"}</button></div></div>`;
    $$("[data-ch]",w.body).forEach(b=>b.onclick=()=>{ if(s.locked)return; s.answers[s.i]=+b.dataset.ch; this.render(w); });
    $('[data-a="back"]',w.body).onclick=()=>{s.mode=null;this.render(w);};
    $('[data-a="next"]',w.body).onclick=()=>{
      if(!s.locked){ if(picked==null){toast("Bir şık seç");return;} s.locked=true; }
      else { s.i++; s.locked=false; }
      this.render(w); };
  }};

/* ---------------- Takvim (gerçek tarihli) + Sınavlar ---------------- */
function mondayOf(d){ const x=new Date(d+"T12:00:00"); const wd=(x.getDay()+6)%7; return addDays(d,-wd); }
function examList(){ return DB.exams.slice().filter(e=>e.date>=addDays(today(),-1)).sort((a,b)=>a.date.localeCompare(b.date)); }

            <div class="sub">${esc(e.date)}</div></div>

          ||`<div class="sub">Yaklaşan sınav yok</div>`}</div>
        <button class="btn sm" style="width:100%;margin-top:8px" data-a="addexam">+ Sınav ekle</button>
        <div class="sep"></div>
        <div class="sub">Bu hafta planlanan<br><b style="font-size:18px;color:var(--text)">${total} saat</b></div>
        <div class="sep"></div>
        <div class="sub">↻ işareti olan bloklar her hafta tekrar eder.</div>
      </div>
      <div class="app grow">
        <div class="toolbar">
          <button class="btn sm" data-a="prev">‹</button>

          <button class="btn sm danger" data-a="clr">Temizle</button>

    A("today").onclick=()=>{s.week=mondayOf(today());this.render(w);};
    A("clr").onclick=()=>{ if(confirm("Bu haftanın blokları ve tekrar edenler silinsin mi?")){
      const ids=new Set(weekEvents.map(e=>e.id)); DB.events=DB.events.filter(e=>!ids.has(e.id)); saveAnd("calendar"); }};

    $$("[data-ev]",w.body).forEach(b=>b.onclick=async e=>{
      e.stopPropagation();

      const v=await dialog("Bloğu düzenle",[
        {k:"title",label:"Başlık",value:ev.title},
        {k:"course",label:"Ders",type:"select",value:ev.courseId,options:DB.courses.map(c=>({v:c.id,l:c.name}))},
        {k:"start",label:"Başlangıç saati",type:"number",value:ev.start,min:0,max:23},
        {k:"len",label:"Süre (saat)",type:"number",value:ev.end-ev.start,min:1,max:6}]);
      if(!v)return;
      ev.title=v.title; ev.courseId=v.course; ev.start=Math.max(0,Math.min(23,+v.start));
      ev.end=Math.min(24,ev.start+Math.max(1,+v.len||1)); saveAnd("calendar"); });
  }};

/* ---------------- İstatistik ---------------- */
function minutesByDay(n){ const out=[]; for(let i=n-1;i>=0;i--){ const d=addDays(today(),-i);
  out.push({d, m:DB.sessions.filter(s=>s.date===d).reduce((a,b)=>a+b.min,0)}); } return out; }
function streak(){ let n=0,d=today();
  if(!DB.sessions.some(s=>s.date===d)) d=addDays(d,-1);
  while(DB.sessions.some(s=>s.date===d)){n++;d=addDays(d,-1);} return n; }

    const bars=days.map((d,i)=>{ const h=d.m/max*CH;
      return `<g><rect class="bar" x="${(i*bw+bw*0.18).toFixed(1)}" y="${(CH-h).toFixed(1)}" width="${(bw*0.64).toFixed(1)}" height="${Math.max(h,d.m?2:0).toFixed(1)}" rx="4"><title>${d.d}: ${d.m} dk</title></rect>
        ${d.m?`<text class="axis" x="${(i*bw+bw/2).toFixed(1)}" y="${(CH-h-5).toFixed(1)}" text-anchor="middle">${d.m}</text>`:""}
        <text class="axis" x="${(i*bw+bw/2).toFixed(1)}" y="${CH+14}" text-anchor="middle">${d.d.slice(8)}</text></g>`;}).join("");
    /* 12 haftalık ısı haritası — tek hue, açıktan koyuya */
    const hm=minutesByDay(84), hmax=Math.max(60,...hm.map(d=>d.m));
    const heat=hm.map(d=>{ const r=d.m/hmax;
      const bg=d.m?`color-mix(in srgb, var(--s1) ${Math.round(18+r*82)}%, var(--surface-3))`:"var(--surface-3)";
      return `<i style="background:${bg}" title="${d.d}: ${d.m} dk"></i>`;}).join("");

      .sort((a,b)=>b.m-a.m);

          <div class="card"><div class="sub">Oturum</div><div class="hero">${DB.sessions.length}</div></div>
          <div class="card"><div class="sub">Tekrar bekleyen</div><div class="hero">${dueCards().length}</div></div>
        </div>
        <div class="card" style="margin-top:12px">

          <svg viewBox="0 0 ${CW} ${CH+22}" width="100%" height="${CH+22}" style="margin-top:8px;overflow:visible" role="img" aria-label="Son 14 günün günlük çalışma dakikaları">
            <line class="gridline" x1="0" y1="${CH}" x2="${CW}" y2="${CH}"></line>${bars}</svg>
        </div>
        <div class="card" style="margin-top:12px">
          <div class="h2">Son 12 hafta</div>
          <div class="heat" style="margin-top:10px">${heat}</div>
          <div class="sub" style="margin-top:8px">Koyu = daha çok çalışma · her kare bir gün</div>
        </div>
        <div class="card" style="margin-top:12px">
          <div class="h2">Derslere göre</div>
          ${byCourse.map(x=>`<div style="margin-top:10px">
            <div class="row"><span class="dotc" style="background:${x.c.color}"></span>
              <span class="grow">${esc(x.c.name)}</span>
              <span class="sub">${fmtMin(x.m)} · konu %${prog(x.c.id)}</span></div>
            <div class="meter" style="margin-top:5px"><i style="width:${(x.m/totalAll*100).toFixed(1)}%;background:${x.c.color}"></i></div>
          </div>`).join("")||`<div class="empty">Henüz veri yok</div>`}
        </div>
        ${(()=>{
          const byTopic={};
          DB.sessions.filter(x=>x.topicId).forEach(x=>{ byTopic[x.topicId]=(byTopic[x.topicId]||0)+x.min; });
          const rows=Object.entries(byTopic).map(([id,m])=>({t:DB.topics.find(t=>t.id===id),m}))
            .filter(r=>r.t).sort((a,b)=>b.m-a.m).slice(0,10);
          if(!rows.length) return "";
          const mx=Math.max(...rows.map(r=>r.m));
          return `<div class="card" style="margin-top:12px"><div class="h2">Konulara göre</div>
            ${rows.map(r=>`<div style="margin-top:9px">
              <div class="row"><span class="grow">${esc(r.t.name)}</span>
                <span class="sub">${esc(cname(r.t.courseId))} · ${fmtMin(r.m)}</span></div>
              <div class="meter" style="margin-top:5px"><i style="width:${(r.m/mx*100).toFixed(1)}%;background:${ccolor(r.t.courseId)}"></i></div>
            </div>`).join("")}</div>`;
        })()}
        ${(()=>{ const zayif=weakTopics();
          if(!zayif.length) return DB.quizRuns.some(r=>r.topics&&Object.keys(r.topics).length) ? "" :
            `<div class="card" style="margin-top:12px"><div class="h2">Zayıf konular</div>
              <div class="sub" style="margin-top:6px">Quiz sorularına konu işaretlersen (Quiz → ✏️ → soru altındaki
                konu seçici) burada hangi konuda yanlış yaptığın çıkar.</div></div>`;
          return `<div class="card" style="margin-top:12px"><div class="h2">Zayıf konular</div>
            <div class="sub" style="margin-top:4px">Quiz denemelerindeki yanlış oranına göre</div>
            ${zayif.map(z=>`<div style="margin-top:9px">
              <div class="row"><span class="grow">${esc(z.ad)}</span>
                <span class="sub">${esc(cname(z.courseId))} · ${z.yanlis}/${z.toplam} yanlış · %${Math.round(z.oran*100)}</span></div>
              <div class="meter" style="margin-top:5px"><i style="width:${(z.oran*100).toFixed(0)}%;background:var(--bad)"></i></div>
            </div>`).join("")}</div>`; })()}
        <div class="card" style="margin-top:12px">
          <div class="h2">Günlük döküm</div>
          <table style="width:100%;border-collapse:collapse;margin-top:8px;font-size:12.5px">
            <tr class="sub"><th style="text-align:left">Gün</th><th style="text-align:right">Dakika</th><th style="text-align:right">Oturum</th></tr>
            ${days.slice().reverse().filter(d=>d.m).map(d=>`<tr><td style="padding:3px 0">${d.d}</td>
              <td style="text-align:right">${d.m}</td><td style="text-align:right">${DB.sessions.filter(s=>s.date===d.d).length}</td></tr>`).join("")
              ||`<tr><td colspan="3" class="sub" style="padding:8px 0">Kayıt yok</td></tr>`}
          </table>
        </div>
      </div></div>`;
  }, onResize(w){ this.render(w); }};
/* Quiz denemelerinden konu bazlı yanlış oranı. Soruya konu işaretlenmemişse
   hesaba girmez; az denenmiş konular gürültü yapmasın diye minAdet eşiği var. */
function weakTopics(minAdet=3,limit=5){
  const acc={};
  for(const r of DB.quizRuns) for(const [tid,ar] of Object.entries(r.topics||{})){
    const a=acc[tid]||(acc[tid]={d:0,y:0}); a.d+=ar[0]||0; a.y+=ar[1]||0;
  }
  return Object.entries(acc)
    .map(([id,a])=>({id,ad:DB.topics.find(t=>t.id===id)?.name||"—",
      courseId:DB.topics.find(t=>t.id===id)?.courseId,
      dogru:a.d,yanlis:a.y,toplam:a.d+a.y,oran:a.y/Math.max(1,a.d+a.y)}))
    .filter(x=>x.toplam>=minAdet&&x.yanlis>0)
    .sort((a,b)=>b.oran-a.oran||b.toplam-a.toplam)
    .slice(0,limit);
}

/* ---------------- Günlük plan — "Bugün ne çalışayım" ----------------
   Kural tabanlı ve açıklanabilir: her satır neden orada olduğunu yazar.
   Türetilmiştir, veriye yazılmaz — yalnızca "bugün yapıldı" işaretleri saklanır
   ve tarih değişince kendiliğinden sıfırlanır. */
const PLAN_BLOK=25, PLAN_SATIR=5;
/* İhmal edilen konunun ağırlığı. Sınav ağırlığı 1/kalan_gün olduğu için 0.1,
   "10 gün sonraki sınav" kadar ağır demek: 10 günden yakın sınavlar ihmali geçer,
   daha uzaktakiler geçemez. Bu sayıyı değiştirmek planın karakterini değiştirir. */
const PLAN_IHMAL=0.1;
function planDone(){ const p=DB.settings.planDone; return p&&p.date===today()?(p.ids||[]):[]; }
function planToggle(id){
  const ids=planDone(), i=ids.indexOf(id);
  if(i<0) ids.push(id); else ids.splice(i,1);
  DB.settings.planDone={date:today(),ids};
}
function dailyPlan(){
  const t=today(), out=[];
  let kalan=Math.max(PLAN_BLOK,DB.settings.goal||120);      /* günlük hedef dakika */
  const ekle=r=>{ if(out.length>=PLAN_SATIR||kalan<=0) return; out.push(r); kalan-=r.dk; };

  /* 1) vadesi gelen kartlar her zaman ilk sırada — biriktikçe telafisi zorlaşır */
  const due=dueCards().length;
  if(due) ekle({id:"kart",icon:"🗂",baslik:`${due} kart tekrarı`,alt:"",neden:"vadesi geldi",
    dk:Math.min(PLAN_BLOK,Math.max(5,Math.round(due*0.25))),tip:"kart"});

  /* 2) bugün ve geçmiş vadeli görevler — en fazla 2, gün planını yutmasınlar */
  DB.tasks.filter(x=>!x.done&&x.due&&x.due<=t)
    .sort((a,b)=>a.due.localeCompare(b.due)||(b.pri||0)-(a.pri||0))
    .slice(0,2)
    .forEach(x=>ekle({id:"gorev:"+x.id,icon:"✅",baslik:x.title,alt:cname(x.courseId),
      neden:x.due<t?`${dayDiff(x.due,t)} gün gecikti`:"bugün teslim",
      dk:PLAN_BLOK,tip:"gorev",courseId:x.courseId,taskId:x.id}));

  /* 3) konular: yaklaşan sınav ağır basar (ağırlık 1/kalan gün),
        sınavı olmayan derslerde 7 gündür dokunulmamış konular arkadan gelir */
  const bugunCalisilan=new Set(DB.sessions.filter(x=>x.date===t&&x.topicId).map(x=>x.topicId));
  const sonHafta=new Set(DB.sessions.filter(x=>x.date>addDays(t,-7)&&x.topicId).map(x=>x.topicId));
  const aday=new Map();
  const koy=(k,w,neden)=>{ const v=aday.get(k.id);
    if(!v||w>v.w) aday.set(k.id,{topicId:k.id,courseId:k.courseId,ad:k.name,w,neden}); };
  const sinavliDers=new Set();
  for(const e of examList()){
    sinavliDers.add(e.courseId);
    const gun=Math.max(0,dayDiff(t,e.date));
    for(const k of DB.topics.filter(k=>k.courseId===e.courseId&&k.status!=="known"))
      koy(k, (1/Math.max(1,gun))*(k.status==="new"?1.2:1),
        gun===0?`${e.name} · bugün!`:`${e.name} · ${gun} gün kaldı`);   /* sınav adı zaten "sınav" içerebilir */
  }
  for(const k of DB.topics){
    if(k.status!=="learning"||sinavliDers.has(k.courseId)||sonHafta.has(k.id)) continue;
    koy(k,PLAN_IHMAL,"7 gündür dokunulmadı");
  }
  [...aday.values()]
    .map(x=>bugunCalisilan.has(x.topicId)?{...x,w:x.w*0.25}:x)   /* bugün çalışılana öncelik verme */
    .sort((a,b)=>b.w-a.w||a.ad.localeCompare(b.ad))
    .forEach(x=>ekle({id:"konu:"+x.topicId,icon:"🧠",baslik:x.ad,alt:cname(x.courseId),
      neden:x.neden,dk:PLAN_BLOK,tip:"konu",courseId:x.courseId,topicId:x.topicId}));

  return out;
}

<script>
/* ============================================================

/* ---------------- Terminal ---------------- */
APPS.term={ name:"Terminal", icon:">_", w:640, h:420, desk:true, single:true,
  render(w){
    const s=w.state; s.log=s.log||[{t:"dim",x:"StudyOS terminal · komutlar için `yardim` yaz"}];
    w.body.innerHTML=`<div class="term" data-a="scr">
      ${s.log.map(l=>`<div class="${l.t||""}">${l.x}</div>`).join("")}
      <div class="row"><span class="pr">study&nbsp;›&nbsp;</span><input class="in" data-a="in" autocomplete="off" spellcheck="false"></div></div>`;

    scr.onclick=()=>inp.focus(); setTimeout(()=>inp.focus(),30);

    const out=(x,t)=>s.log.push({x,t});
    inp.onkeydown=ev=>{
      if(ev.key!=="Enter")return;

      switch((cmd||"").toLowerCase()){

        case "yardim": case "help": out(`<span class="ok">komutlar</span>
  <b>ac</b> &lt;uygulama&gt;     uygulama aç (notlar, gorevler, kartlar, pomodoro, quiz, takvim, konular, istatistik, gunluk)
  <b>gorev</b> &lt;metin&gt;      yeni görev ekle
  <b>not</b> &lt;başlık&gt;       yeni not oluştur
  <b>kart</b> &lt;ön&gt; | &lt;arka&gt;  hızlı kart ekle
  <b>calis</b> [dakika]      pomodoro başlat
  <b>odak</b>                odak moduna gir
  <b>durum</b>               bugünün özeti
  <b>seri</b>                çalışma serisi
  <b>surum</b>               sürüm ve cihaz bilgisi
  <b>tema</b>                açık/koyu geçiş
  <b>yedek</b>               JSON dışa aktar
  <b>temizle</b>             ekranı temizle`); break;
        case "ac": { const map={notlar:"notes",gorevler:"tasks",kartlar:"cards",pomodoro:"pomodoro",quiz:"quiz",takvim:"calendar",konular:"topics",istatistik:"stats",gunluk:"journal",ayarlar:"settings"};
          const a=map[arg.toLowerCase()]; if(a){openApp(a);out(`<span class="ok">${arg} açıldı</span>`);} else out(`bilinmeyen uygulama: ${esc(arg)}`,"er"); break; }
        case "gorev": if(!arg){out("kullanım: gorev <metin>","er");break;}
          DB.tasks.push({id:uid(),courseId:DB.courses[0]?.id,title:arg,done:false,pri:1,due:null,created:today()});
          saveAnd("tasks"); out(`<span class="ok">✓ görev eklendi:</span> ${esc(arg)}`); break;
        case "not": { const t=today(); const n={id:uid(),courseId:DB.courses[0]?.id,title:arg||"Yeni not",body:"",created:t,updated:t};
          DB.notes.push(n); saveAnd("notes"); openApp("notes",{state:{id:n.id}}); out(`<span class="ok">✓ not oluşturuldu</span>`); break; }
        case "kart": { const [f,b]=arg.split("|").map(x=>x&&x.trim());
          if(!f||!b){out("kullanım: kart Soru | Cevap","er");break;}

          DB.cards.push({id:uid(),deckId:dk.id,front:f,back:b,ef:2.5,int:0,reps:0,lapses:0,due:today()});
          saveAnd("cards"); out(`<span class="ok">✓ "${esc(dk.name)}" destesine eklendi</span>`); break; }
        case "calis": { const m=+arg||DB.settings.pomo; DB.settings.pomo=m; save();
          Pomo.start(DB.courses[0]?.id,"terminal"); openApp("pomodoro"); out(`<span class="ok">▶ ${m} dakika başladı</span>`); break; }

        case "durum": { const m=DB.sessions.filter(x=>x.date===today()).reduce((a,b)=>a+b.min,0);
          out(`bugün: <b>${fmtMin(m)}</b> · hedef ${fmtMin(DB.settings.goal)}
açık görev: <b>${DB.tasks.filter(t=>!t.done).length}</b>
tekrar bekleyen kart: <b>${dueCards().length}</b>
seri: <b>${streak()} gün</b>`); break; }

kaynak: ${esc(location.href.slice(0,60))}
depolama: metin ${bytesFmt(storageUsed())} · medya ${bytesFmt(IDB_BYTES)}
cihaz dosyasına bağlanma: ${canLinkFiles()?"<b>var</b>":"yok"}`); break;

/* ============================================================
   İÇ BAĞLANTILAR  [[Not]]  [[#Konu]]  [[?Test]]  [[!Kart]]  [[@Sınav]]
   ============================================================ */
const WL_ICON={note:"📝",topic:"🧠",quiz:"❓",card:"🗂",exam:"🎓"};
const WL_PREFIX={"#":"topic","?":"quiz","!":"card","@":"exam"};
const rxEsc=s=>String(s).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
function wlParse(raw){
  raw=String(raw).trim();
  const m=raw.match(/^([#?!@])\s*(.+)$/);
  return m?{t:WL_PREFIX[m[1]],q:m[2].trim()}:{t:"note",q:raw};
}
function wlFind(p){
  const eq=(a,b)=>String(a||"").toLowerCase().trim()===String(b||"").toLowerCase().trim();
  switch(p.t){
    case "topic": return DB.topics.find(x=>eq(x.name,p.q));
    case "quiz":  return DB.quizzes.find(x=>eq(x.name,p.q));
    case "card":  return DB.cards.find(x=>eq(x.front,p.q));
    case "exam":  return DB.exams.find(x=>eq(x.name,p.q));
    default:      return DB.notes.find(x=>eq(x.title,p.q));
  }
}
/* açık bir Notlar penceresi varsa onu kullan, yenisini açma */
function openNote(id,prev){
  let w=[...WINS.values()].reverse().find(x=>x.appId==="notes");
  if(!w) w=openApp("notes");
  w.state.id=id; if(prev!=null) w.state.prev=prev;
  w.node.classList.remove("min"); focusWin(w); APPS.notes.render(w); syncDock();
  return w;
}
function wlOpen(raw){
  const p=wlParse(raw), hit=wlFind(p);
  if(!hit){
    if(p.t!=="note"){ toast("Bulunamadı: "+p.q); return; }
    if(!confirm(`"${p.q}" notu yok. Oluşturulsun mu?`)) return;
    const t=today(), n={id:uid(),courseId:DB.courses[0]?.id,title:p.q,body:"",created:t,updated:t};
    DB.notes.push(n); save(); openNote(n.id,false); return;
  }
  if(p.t==="note"){ openNote(hit.id,true); }
  else if(p.t==="topic"){ const w=openApp("topics"); w.state.course=hit.courseId; APPS.topics.render(w); }
  else if(p.t==="quiz"){ const w=openApp("quiz"); Object.assign(w.state,{quiz:hit.id,mode:"run",i:0,answers:[],locked:false,logged:false}); APPS.quiz.render(w); }
  else if(p.t==="card"){ const w=openApp("cards"); Object.assign(w.state,{deck:hit.deckId,mode:null}); APPS.cards.render(w); }
  else if(p.t==="exam"){ openApp("calendar"); }
}
/* bir nota bağlanan notlar */
function backlinks(n){
  if(!n||!n.title) return [];
  const rx=new RegExp("\\[\\[\\s*"+rxEsc(n.title)+"\\s*\\]\\]","i");
  return DB.notes.filter(x=>x.id!==n.id&&rx.test(x.body));
}
/* dış bağlantı rozetleri */
function linkBadge(u){
  const host=((u.match(/^https?:\/\/([^/]+)/)||[,""])[1]||"").replace(/^www\./,"");
  if(/drive\.google|docs\.google/.test(host)) return ["📄",host];
  if(/photos\.google/.test(host))             return ["🖼",host];
  if(/youtube\.com|youtu\.be/.test(host))     return ["▶️",host];
  if(/\.pdf(\?|#|$)/i.test(u))                return ["📕",host];
  return ["🔗",host];
}
/* çizimden sonra: iç linkleri bağla, terimleri işaretle */
function decorate(root){
  $$("[data-wl]",root).forEach(a=>{ a.onclick=e=>{ e.preventDefault(); wlOpen(a.dataset.wl); }; });
  /* yalnızca not önizlemesindeki görseller: kart yüzündeki görsele dokunmak kartı çevirir */
  $$(".md-prev img[data-media]",root).forEach(im=>{
    im.onclick=e=>{ e.stopPropagation(); imageViewer(im.dataset.media); }; });
  if(typeof decorateTerms==="function") decorateTerms(root);
}

/* ============================================================
   BAĞLANTI HARİTASI
   ============================================================ */
function graphData(){
  const nodes=DB.notes.map(n=>({id:n.id,label:n.title||"Adsız",course:n.courseId,
    x:Math.random()*600+100,y:Math.random()*400+80,vx:0,vy:0,deg:0}));
  const byId=new Map(nodes.map(n=>[n.id,n]));
  const links=[];
  DB.notes.forEach(n=>{
    [...n.body.matchAll(/\[\[([^\]\n]+)\]\]/g)].forEach(m=>{
      const p=wlParse(m[1]); if(p.t!=="note") return;
      const tgt=wlFind(p); if(!tgt||tgt.id===n.id) return;
      const a=byId.get(n.id), b=byId.get(tgt.id); if(!a||!b) return;
      if(links.some(l=>(l.a===a&&l.b===b)||(l.a===b&&l.b===a))) return;
      links.push({a,b}); a.deg++; b.deg++;
    });
  });
  if(nodes.length>CAP){
    const keep=new Set(); links.forEach(l=>{keep.add(l.a.id);keep.add(l.b.id);});
    const kept=nodes.filter(n=>keep.has(n.id));
    if(kept.length) return {nodes:kept,links,trimmed:nodes.length-kept.length};
  }
  return {nodes,links,trimmed:0};
}
function graphLayout(g,W,H,iters=320){
  const {nodes,links}=g, k=Math.sqrt((W*H)/Math.max(1,nodes.length))*0.6;
  for(let it=0;it<iters;it++){
    const t=1-it/iters;
    for(let i=0;i<nodes.length;i++) for(let j=i+1;j<nodes.length;j++){
      const a=nodes[i],b=nodes[j];
      let dx=a.x-b.x, dy=a.y-b.y, d2=dx*dx+dy*dy||0.01, d=Math.sqrt(d2);
      const f=(k*k)/d2*6;
      dx/=d; dy/=d; a.vx+=dx*f; a.vy+=dy*f; b.vx-=dx*f; b.vy-=dy*f;
    }
    links.forEach(({a,b})=>{
      let dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||0.01;
      const f=(d-k)*0.035; dx/=d; dy/=d;
      a.vx+=dx*f*d*0.35; a.vy+=dy*f*d*0.35; b.vx-=dx*f*d*0.35; b.vy-=dy*f*d*0.35;
    });
    nodes.forEach(n=>{
      n.vx+=(W/2-n.x)*0.004; n.vy+=(H/2-n.y)*0.004;
      n.x+=Math.max(-30,Math.min(30,n.vx*t)); n.y+=Math.max(-30,Math.min(30,n.vy*t));
      n.vx*=0.82; n.vy*=0.82;
      n.x=Math.max(40,Math.min(W-40,n.x)); n.y=Math.max(30,Math.min(H-30,n.y));
    });
  }
}

const PDFJS_LIB="vendor/pdf.min.js", PDFJS_WORKER="vendor/pdf.worker.min.js";
function ensurePdfJs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  return new Promise((res,rej)=>{
    const sc=el("script"); sc.src=PDFJS_LIB;
    sc.onload=()=>{ try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_WORKER; }catch(e){}
      res(window.pdfjsLib); };
    sc.onerror=()=>rej(new Error("pdfjs yüklenemedi"));
    document.head.appendChild(sc);
  });
}
function pdfPosGet(key){ return (DB.settings.pdfPos||{})[key]||1; }
let _pdfPosT=null;
function pdfPosSet(key,page){
  if(!key) return;
  DB.settings.pdfPos=DB.settings.pdfPos||{};
  if(DB.settings.pdfPos[key]===page) return;

function pdfNav(w){

function pdfGo(w,page){
  const s=w.state; if(!s.slots) return;
  const p=Math.max(1,Math.min(s.total,page));
  s.slots[p-1]?.scrollIntoView({block:"start",behavior:Math.abs(p-(s.page||1))>3?"auto":"smooth"});
  s.page=p; pdfNav(w); pdfPosSet(s.pdfKey,p);
}
/* Sayfalar önce boş kutu olarak dizilir; görünüre girince çizilir,
   uzaklaşınca boşaltılır — 200+ sayfalık dosyalar da akıcı kalsın. */
async function renderPdf(file,box,info,w){
  const lib=await ensurePdfJs();
  const doc=await lib.getDocument({data:await file.arrayBuffer()}).promise;
  const s=w.state; s.doc=doc; s.total=doc.numPages; s.zoom=s.zoom||1;
  const v1=(await doc.getPage(1)).getViewport({scale:1});
  box.innerHTML="";
  const slots=[];
  for(let i=1;i<=doc.numPages;i++){
    const d=el("div","pdfslot",`<span class="sub">${i}</span>`);
    d.dataset.p=i; d.style.aspectRatio=(v1.width/v1.height).toFixed(4);
    box.appendChild(d); slots.push(d);
  }
  s.slots=slots;
  const drawn=new Set();
  const draw=async d=>{
    const i=+d.dataset.p;
    if(drawn.has(i)||d.dataset.busy) return;
    d.dataset.busy="1";
    try{
      const page=await doc.getPage(i);
      const target=Math.max(300,(box.clientWidth||700)-26)*s.zoom;
      const base=page.getViewport({scale:1}).width;
      const vp=page.getViewport({scale:(target/base)*Math.min(2,window.devicePixelRatio||1)});
      const c=el("canvas","pdfpage"); c.width=vp.width; c.height=vp.height; c.style.width="100%";
      await page.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
      d.style.aspectRatio=(vp.width/vp.height).toFixed(4);
      d.innerHTML=""; d.appendChild(c); drawn.add(i);
    }catch(e){}
    delete d.dataset.busy;
  };
  s.io=new IntersectionObserver(es=>{
    es.forEach(e=>{ if(e.isIntersecting) draw(e.target); });
    if(drawn.size>16){                       /* uzaktaki sayfaları bellekten düşür */
      const cur=s.page||1;
      [...drawn].filter(i=>Math.abs(i-cur)>8).forEach(i=>{
        const d=slots[i-1]; d.innerHTML=`<span class="sub">${i}</span>`; drawn.delete(i); });
    }
  },{root:box,rootMargin:"700px 0px"});
  s.io2=new IntersectionObserver(es=>{
    const top=es.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];
    if(top){ s.page=+top.target.dataset.p; pdfNav(w); pdfPosSet(s.pdfKey,s.page); }
  },{root:box,threshold:[.25,.6]});
  slots.forEach(d=>{ s.io.observe(d); s.io2.observe(d); });
  if(info) info.textContent=doc.numPages+" sayfa";
  const saved=pdfPosGet(s.pdfKey);
  if(saved>1&&saved<=doc.numPages){
    setTimeout(()=>{ slots[saved-1].scrollIntoView({block:"start"}); s.page=saved; pdfNav(w);
      toast(`${saved}. sayfadan devam ediliyor`); },150);
  } else { s.page=1; pdfNav(w); }
}

async function openElsewhere(file,name){
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:name||file.name});
      return true;
    }
  }catch(e){ if(e&&e.name==="AbortError") return true; toast("Cihazda açılamadı"); }
  const u=URL.createObjectURL(file);
  const win=window.open(u,"_blank");
  if(!win) toast("Tarayıcı yeni sekmeyi engelledi");
  setTimeout(()=>URL.revokeObjectURL(u),60000);
  return false;
}

function wlAutocomplete(ta,onchange){
  const box=$("#wlac"); let items=[],sel=0,open=false,start=-1;
  const close=()=>{ open=false; box.classList.remove("on"); };
  const suggest=q=>{
    const ql=q.toLowerCase(), out=[];
    DB.notes.forEach(n=>{ if(!ql||(n.title||"").toLowerCase().includes(ql)) out.push({ic:"📝",label:n.title||"Adsız",ins:n.title||""}); });
    if(ql){
      DB.topics.forEach(t=>{ if(t.name.toLowerCase().includes(ql)) out.push({ic:"🧠",label:t.name,ins:"#"+t.name}); });
      DB.quizzes.forEach(x=>{ if(x.name.toLowerCase().includes(ql)) out.push({ic:"❓",label:x.name,ins:"?"+x.name}); });
      DB.exams.forEach(x=>{ if(x.name.toLowerCase().includes(ql)) out.push({ic:"🎓",label:x.name,ins:"@"+x.name}); });
      out.push({ic:"✨",label:`"${q}" — yeni not olarak`,ins:q});
    }
    return out.slice(0,8);
  };
  const paint=()=>{ box.innerHTML=items.map((r,i)=>
      `<div class="it ${i===sel?"on":""}" data-i="${i}"><span>${r.ic}</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.label)}</span></div>`).join("");
    $$(".it",box).forEach(n=>n.onmousedown=e=>{ e.preventDefault(); pick(+n.dataset.i); }); };
  const place=()=>{ const r=ta.getBoundingClientRect();
    box.style.left=Math.max(8,Math.min(r.left+24,window.innerWidth-250))+"px";
    box.style.top=Math.max(36,Math.min(r.top+46,window.innerHeight-250))+"px"; };
  const pick=i=>{ const r=items[i]; if(!r) return;
    const after=ta.value.slice(ta.selectionStart), before=ta.value.slice(0,start);
    ta.value=before+r.ins+"]]"+after;
    const pos=before.length+r.ins.length+2; ta.setSelectionRange(pos,pos);
    close(); onchange&&onchange(); ta.focus(); };
  const check=()=>{
    const pre=ta.value.slice(0,ta.selectionStart), m=pre.match(/\[\[([^\]\n]*)$/);
    if(!m){ close(); return; }
    start=ta.selectionStart-m[1].length; items=suggest(m[1]); sel=0;
    if(!items.length){ close(); return; }
    open=true; box.classList.add("on"); place(); paint();
  };
  ta.addEventListener("input",check);
  ta.addEventListener("click",check);
  ta.addEventListener("blur",()=>setTimeout(close,150));
  ta.addEventListener("keydown",e=>{
    if(!open) return;
    if(e.key==="ArrowDown"){ sel=(sel+1)%items.length; paint(); e.preventDefault(); }
    else if(e.key==="ArrowUp"){ sel=(sel-1+items.length)%items.length; paint(); e.preventDefault(); }
    else if(e.key==="Enter"||e.key==="Tab"){ pick(sel); e.preventDefault(); }
    else if(e.key==="Escape"){ close(); e.preventDefault(); }
  });
}

/* ============================================================
   SÖZLÜK — terimler metinlerde otomatik işaretlenir, üstüne
   gelince tanım balonu açılır (AMBOSS tarzı)
   ============================================================ */
let TERM_RX=null, TERM_MAP=null, _popT=null;
function buildTerms(){
  TERM_RX=null; TERM_MAP=new Map();
  const all=[];
  (DB.terms||[]).forEach(t=>[t.term,...(t.alt||[])].filter(Boolean)
    .forEach(x=>{ all.push(x.trim()); TERM_MAP.set(x.trim().toLowerCase(),t.id); }));
  if(!all.length) return;
  all.sort((a,b)=>b.length-a.length);
  try{ TERM_RX=new RegExp("(?<![\\p{L}\\p{N}])("+all.map(rxEsc).join("|")+")(?![\\p{L}\\p{N}])","giu"); }
  catch(e){ TERM_RX=new RegExp("\\b("+all.map(rxEsc).join("|")+")\\b","gi"); }
}
function decorateTerms(root){
  if(!DB.terms||!DB.terms.length) return;
  if(!TERM_MAP) buildTerms();
  if(!TERM_RX) return;
  $$(".md-prev,.flash-card,[data-gloss]",root).forEach(cont=>{
    const wk=document.createTreeWalker(cont,NodeFilter.SHOW_TEXT,{acceptNode(n){
      if(!n.nodeValue||!n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      const p=n.parentElement;
      if(!p||p.closest("a,code,pre,textarea,input,select,.gterm")) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT; }});
    const nodes=[]; let n; while((n=wk.nextNode())) nodes.push(n);
    nodes.forEach(node=>{
      const txt=node.nodeValue; TERM_RX.lastIndex=0;
      if(!TERM_RX.test(txt)) return;
      TERM_RX.lastIndex=0;
      const frag=document.createDocumentFragment(); let last=0,m;
      while((m=TERM_RX.exec(txt))){
        if(m.index>last) frag.appendChild(document.createTextNode(txt.slice(last,m.index)));
        const sp=el("span","gterm"); sp.textContent=m[1];
        sp.dataset.term=TERM_MAP.get(m[1].toLowerCase())||"";
        frag.appendChild(sp); last=m.index+m[1].length;
      }
      if(last<txt.length) frag.appendChild(document.createTextNode(txt.slice(last)));
      node.replaceWith(frag);
    });
  });
  $$(".gterm",root).forEach(sp=>{
    sp.onclick=e=>{ e.stopPropagation(); showTerm(sp); };
    if(matchMedia("(hover:hover)").matches){
      sp.onmouseenter=()=>{ clearTimeout(_popT); showTerm(sp); };
      sp.onmouseleave=()=>{ _popT=setTimeout(hideTerm,260); };
    }
  });
}
function hideTerm(){ $("#termpop").classList.remove("on"); }

  const img=t.img||noteImg;
  const excerpt=note?note.body.replace(/!\[[^\]]*\]\([^)]*\)/g,"").replace(/\[\[([^\]]+)\]\]/g,"$1")
    .replace(/[#*>`=]/g,"").replace(/\s+/g," ").trim().slice(0,150):"";

async function exportJSON(){
  toast("Yedek hazırlanıyor…"); flush();
  const media={};
  try{ for(const k of await idbKeys()){ const b=await idbGet(k); if(b) media[k]=await blobToDataURL(b); } }catch(e){}
  DB.settings.lastBackup=today(); saveNow();
  const blob=new Blob([JSON.stringify({...DB,_media:media},null,2)],{type:"application/json"});
  const a=el("a"); a.href=URL.createObjectURL(blob); a.download=`studyos-yedek-${today()}.json`;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
  toast(`Yedek indirildi (${bytesFmt(blob.size)})`);
}
const PREV_KEY=KEY+".oncesi";
function importJSON(){
  const i=el("input"); i.type="file"; i.accept="application/json";
  i.onchange=()=>{ const f=i.files[0]; if(!f)return; const r=new FileReader();
    r.onload=async()=>{
      let d;
      try{ d=JSON.parse(r.result); if(!d||!Array.isArray(d.notes)) throw 0; }
      catch(e){ toast("⚠️ Geçersiz dosya"); return; }
      const say=o=>`${(o.notes||[]).length} not · ${(o.cards||[]).length} kart · ${(o.sessions||[]).length} oturum`;
      if(!confirm(`Yedek yüklenecek — mevcut veri silinecek.\n\nGelen:  ${say(d)}\nŞu anki: ${say(DB)}\n\nDevam edilsin mi?\n(Şu anki hal saklanır, Ayarlar'dan geri dönebilirsin.)`)) return;
      /* geri dönüş için: hem anlık görüntü hem ham metin kopyası */
      await takeSnapshot("import");
      try{ const cur=localStorage.getItem(KEY); if(cur) localStorage.setItem(PREV_KEY,cur); }
      catch(e){ if(!confirm("Uyarı: mevcut halin kopyası alınamadı (depo dolu). Yine de devam edilsin mi?")) return; }
      const media=d._media||{}; delete d._media;
      for(const [id,url] of Object.entries(media)){ try{ await idbPut(id,dataURLtoBlob(url)); }catch(e){} }
      MEDIA_URL.clear();
      DB=Object.assign(blank(),d);
      DB.settings=Object.assign(blank().settings,d.settings||{});
      saveNow(); buildTerms(); applySettings(); refreshAll(); idbUsage();
      toast(`Yedek yüklendi (${Object.keys(media).length} medya)`);
    };
    r.readAsText(f); };
  i.click();
}
/* içe aktarmadan önceki hale dönüş — tersi de geri alınabilir */
function undoImport(){
  let raw=null; try{ raw=localStorage.getItem(PREV_KEY); }catch(e){}
  if(!raw){ toast("Geri dönülecek bir kayıt yok"); return; }
  if(!confirm("Şu anki veri, son içe aktarmadan önceki haliyle değiştirilecek. Devam edilsin mi?")) return;
  try{
    const d=JSON.parse(raw), cur=localStorage.getItem(KEY);
    DB=Object.assign(blank(),d);
    DB.settings=Object.assign(blank().settings,d.settings||{});
    if(cur) localStorage.setItem(PREV_KEY,cur);
    saveNow(); buildTerms(); applySettings(); refreshAll();
    toast("Önceki hale dönüldü");
  }catch(e){ toast("⚠️ Saklanan kopya okunamadı"); }
}

   ============================================================ */
let noiseNode=null, noiseCtx=null;
function toggleNoise(){
  if(noiseNode){ try{noiseNode.stop();}catch(e){} noiseNode=null; $("#foNoise").textContent="🔇 Gürültü"; return; }
  try{
    noiseCtx=noiseCtx||new (window.AudioContext||window.webkitAudioContext)();
    const len=noiseCtx.sampleRate*2, buf=noiseCtx.createBuffer(1,len,noiseCtx.sampleRate), d=buf.getChannelData(0);
    let last=0; for(let i=0;i<len;i++){ const wn=Math.random()*2-1; last=(last+0.02*wn)/1.02; d[i]=last*3.5; }
    const src=noiseCtx.createBufferSource(); src.buffer=buf; src.loop=true;
    const g=noiseCtx.createGain(); g.gain.value=0.12;
    const f=noiseCtx.createBiquadFilter(); f.type="lowpass"; f.frequency.value=900;
    src.connect(f); f.connect(g); g.connect(noiseCtx.destination); src.start();
    noiseNode=src; $("#foNoise").textContent="🔊 Gürültü açık";
  }catch(e){ toast("Ses başlatılamadı"); }
}

   ============================================================ */
function topicOptions(courseId){
  const out=[];
  const walk=(parent,depth)=>DB.topics.filter(t=>t.courseId===courseId&&t.parentId===parent)
    .forEach(t=>{ out.push({id:t.id,label:"— ".repeat(depth)+t.name}); walk(t.id,depth+1); });
  walk(null,0); return out;
}
const topicName=id=>DB.topics.find(t=>t.id===id)?.name||"";
const Study={
  on:false, start:0, courseId:null, topicId:null, tick:null,
  begin(courseId,topicId){
    this.on=true; this.start=Date.now(); this.courseId=courseId; this.topicId=topicId||null;
    DB.settings.activeStudy={start:this.start,courseId,topicId:this.topicId};
    DB.settings.lastCourse=courseId; DB.settings.lastTopic=this.topicId;
    save(); this.run(); paintWidgets();
  },
  resume(a){ if(!a||!a.start) return; this.on=true; this.start=a.start;
    this.courseId=a.courseId; this.topicId=a.topicId; this.run(); },
  run(){ clearInterval(this.tick); this.tick=setInterval(()=>this.paint(),1000); this.paint(); },
  elapsed(){ return Math.max(0,Math.floor((Date.now()-this.start)/1000)); },
  paint(){ const n=$("#studyTime"); if(n) n.textContent=hms(this.elapsed()); },
  end(){
    clearInterval(this.tick); this.on=false;
    const min=Math.max(1,Math.round(this.elapsed()/60));
    DB.sessions.push({id:uid(),courseId:this.courseId,topicId:this.topicId,date:today(),min,kind:"study",
      label:topicName(this.topicId)});
    delete DB.settings.activeStudy;
    save(); updateMenubar(); paintWidgets(); rerender("stats");
    toast(`✅ ${fmtMin(min)} kaydedildi${this.topicId?" — "+topicName(this.topicId):""}`);
  },
  cancel(){ clearInterval(this.tick); this.on=false; delete DB.settings.activeStudy; save(); paintWidgets(); }
};
const hms=s=>`${pad(Math.floor(s/3600))}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}`;

let spotSel=0, spotItems=[];
function spotSearch(q){
  q=q.trim().toLowerCase(); const out=[];
  const add=(icon,title,meta,run)=>out.push({icon,title,meta,run});
  Object.entries(APPS).forEach(([id,a])=>{ if(!q||a.name.toLowerCase().includes(q)) add(a.icon,a.name,"uygulama",()=>openApp(id)); });
  if(q){
    DB.notes.filter(n=>n.title.toLowerCase().includes(q)||n.body.toLowerCase().includes(q)).slice(0,6)
      .forEach(n=>add("📝",n.title||"Adsız","not · "+cname(n.courseId),()=>openNote(n.id,true)));
    DB.tasks.filter(t=>t.title.toLowerCase().includes(q)).slice(0,6)
      .forEach(t=>add(t.done?"☑️":"✅",t.title,"görev · "+cname(t.courseId),()=>openApp("tasks")));
    DB.cards.filter(c=>c.front.toLowerCase().includes(q)||c.back.toLowerCase().includes(q)).slice(0,6)
      .forEach(c=>add("🗂",c.front,"kart · "+(DB.decks.find(d=>d.id===c.deckId)?.name||""),()=>{const w=openApp("cards");w.state.deck=c.deckId;w.state.mode=null;APPS.cards.render(w);}));
    DB.topics.filter(t=>t.name.toLowerCase().includes(q)).slice(0,5)
      .forEach(t=>add("🧠",t.name,"konu · "+cname(t.courseId),()=>{const w=openApp("topics");w.state.course=t.courseId;APPS.topics.render(w);}));
    DB.quizzes.filter(x=>x.name.toLowerCase().includes(q)).slice(0,4)
      .forEach(x=>add("❓",x.name,"test · "+x.questions.length+" soru",()=>{const w=openApp("quiz");w.state.quiz=x.id;w.state.mode="run";w.state.i=0;w.state.answers=[];APPS.quiz.render(w);}));
    (DB.terms||[]).filter(t=>t.term.toLowerCase().includes(q)||t.def.toLowerCase().includes(q)).slice(0,5)
      .forEach(t=>add("📖",t.term,"sözlük · "+cname(t.courseId),()=>{const w=openApp("glossary");w.state.edit=t.id;APPS.glossary.render(w);}));
    DB.exams.filter(e=>e.name.toLowerCase().includes(q)).slice(0,4)
      .forEach(e=>add("🎓",e.name,"sınav · "+e.date,()=>openApp("calendar")));
    add("➕","“"+q+"” görevini ekle","yeni görev",()=>{ DB.tasks.push({id:uid(),courseId:DB.courses[0]?.id,title:q,done:false,pri:1,due:null,created:today()});
      saveAnd("tasks"); toast("Görev eklendi"); });
    add("📝","“"+q+"” notunu oluştur","yeni not",()=>{ const t=today(); const n={id:uid(),courseId:DB.courses[0]?.id,title:q,body:"",created:t,updated:t};
      DB.notes.push(n); save(); openNote(n.id,false); });
  }
  return out.slice(0,12);
}
function paintSpot(){
  $("#spotres").innerHTML=spotItems.map((r,i)=>`<div class="sres ${i===spotSel?"on":""}" data-i="${i}">
    <span class="k">${r.icon}</span><span class="grow" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.title)}</span>
    <span class="m">${esc(r.meta)}</span></div>`).join("")||`<div class="sres m">sonuç yok</div>`;
  $$("#spotres .sres").forEach(n=>n.onclick=()=>{ const r=spotItems[+n.dataset.i]; closeSpot(); r&&r.run(); });
}
function openSpot(){ $("#spot").classList.add("on"); const i=$("#spotin"); i.value=""; spotSel=0;
  spotItems=spotSearch(""); paintSpot(); setTimeout(()=>i.focus(),30); }
function closeSpot(){ $("#spot").classList.remove("on"); }
$("#spotin").addEventListener("input",e=>{ spotItems=spotSearch(e.target.value); spotSel=0; paintSpot(); });
$("#spotin").addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"){spotSel=Math.min(spotItems.length-1,spotSel+1);paintSpot();e.preventDefault();}
  else if(e.key==="ArrowUp"){spotSel=Math.max(0,spotSel-1);paintSpot();e.preventDefault();}
  else if(e.key==="Enter"){const r=spotItems[spotSel];closeSpot();r&&r.run();}
  else if(e.key==="Escape"){closeSpot();}
});
$("#spot").addEventListener("click",e=>{ if(e.target.id==="spot")closeSpot(); });

/* ============================================================
   PENCERE GEÇİŞİ (Alt+Tab / Alt+Q)
   ============================================================ */
let swIdx=0, swOn=false;
function switcher(){
  const list=[...WINS.values()];
  if(list.length<2) return;
  if(!swOn){ swOn=true; swIdx=1; } else swIdx=(swIdx+1)%list.length;
  $("#switcher").classList.add("on");
  $("#switcher .sw").innerHTML=list.map((w,i)=>`<div class="${i===swIdx?"on":""}">
    <span class="g">${APPS[w.appId].icon}</span>${esc(APPS[w.appId].name)}</div>`).join("");
}
function switcherEnd(){
  if(!swOn) return; swOn=false; $("#switcher").classList.remove("on");
  const w=[...WINS.values()][swIdx]; if(w){ w.node.classList.remove("min"); focusWin(w); syncDock(); }
}
document.addEventListener("keyup",e=>{ if(e.key==="Alt") switcherEnd(); });
window.addEventListener("blur",switcherEnd);
/* ekran küçülünce pencereleri görünür alana sığdır */
window.addEventListener("resize",()=>{
  const d=$("#desktop").getBoundingClientRect();
  for(const w of WINS.values()){
    const n=w.node; if(n.classList.contains("max")) continue;
    const wd=Math.min(n.offsetWidth, d.width-16), ht=Math.min(n.offsetHeight, d.height-70);
    n.style.width=wd+"px"; n.style.height=ht+"px";
    n.style.left=Math.max(8,Math.min(parseInt(n.style.left)||0, d.width-wd-8))+"px";
    n.style.top =Math.max(0,Math.min(parseInt(n.style.top)||0,  d.height-60))+"px";
  }
  paintWidgets();
});

/* ============================================================
   PAYLAŞ MENÜSÜNDEN GELEN DOSYALAR (PWA share target)
   Service worker dosyaları önbelleğe koyar, burada nota ekleriz.
   ============================================================ */
async function importShared(){
  if(!/[?&]shared=1/.test(location.search)) return;
  try{ history.replaceState(null,"",location.pathname); }catch(e){}
  if(!window.caches) return;
  try{
    const cache=await caches.open("studyos-share");
    const idxRes=await cache.match("./__shared/index"); if(!idxRes) return;
    const idx=await idxRes.json();
    const files=[];
    for(let i=0;i<(idx.count||0);i++){
      const r=await cache.match("./__shared/"+i); if(!r) continue;
      files.push({name:idx.names[i]||("dosya-"+i), blob:await r.blob()});
      await cache.delete("./__shared/"+i);
    }
    await cache.delete("./__shared/index");
    const extra=[idx.title,idx.text,idx.url].filter(Boolean).join("\n");
    if(!files.length&&!extra) return;
    const v=await dialog(files.length?`${files.length} dosya paylaşıldı`:"Paylaşılan metin",[
      {k:"note",label:"Nereye eklensin?",type:"select",value:"__new",
       options:[{v:"__new",l:"➕ Yeni not"},...DB.notes.slice(0,60).map(n=>({v:n.id,l:n.title||"Adsız"}))]}]);
    if(!v) return;
    let note;
    if(v.note==="__new"){
      const t=today();
      note={id:uid(),courseId:DB.courses[0]?.id,
        title:(idx.title||files[0]?.name||"Paylaşılan").replace(/\.[^.]+$/,""),body:"",created:t,updated:t};
      DB.notes.push(note);
    } else note=DB.notes.find(n=>n.id===v.note);
    if(!note) return;
    if(extra) note.body+="\n\n"+extra+"\n";
    for(const f of files){
      const ref=await putMedia(f.blob);
      if((f.blob.type||"").startsWith("image/")) note.body+=`\n\n![${f.name}](${ref})\n`;
      else (note.att=note.att||[]).push({name:f.name,type:f.blob.type,size:f.blob.size,ref});
    }
    note.updated=today(); save(); flush(); idbUsage();
    openNote(note.id,true);
    toast(`${files.length?files.length+" dosya":"Metin"} nota eklendi`);
  }catch(e){ console.warn("paylaşım alınamadı",e); }
}
